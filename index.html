var D=[
["Nitrous oxide",8,"19–22","Inorganic gas that is a weak general anesthetic but a useful analgesic adjunct. It antagonizes NMDA receptors (similar conceptually to xenon), is nonflammable yet supports combustion, and has relatively low blood solubility so alveolar concentrations rise and fall quickly. Alone it cannot reliably provide surgical anesthesia because MAC is above 100%.","Most often combined with potent volatile agents to lower their MAC (around 65% inspired nitrous oxide can roughly halve volatile MAC). Used for analgesia below MAC in dental care, labor analgesia setups, trauma, and brief procedures when oxygenation and contraindications allow.","Diffuses into closed air spaces faster than nitrogen leaves, expanding pneumothorax, bowel gas, air embolism, pneumocephalus, intraocular gas, and middle-ear grafts; also expands ETT cuff volume. Raises PONV risk in adults, limits FiO2, and with prolonged exposure can impair vitamin B12–dependent enzymes. Usually avoided in early pregnancy contexts per institutional practice.",[["Cardiovascular","Sympathetic stimulation keeps blood pressure, cardiac output and heart rate roughly unchanged despite direct myocardial depression, which can be unmasked in coronary disease or severe hypovolemia. Pulmonary vascular resistance rises modestly."],["Respiratory","Faster, shallower breathing with little change in minute ventilation. Markedly depresses the hypoxic drive even at small concentrations."],["CNS and other organs","Raises cerebral blood flow, blood volume and oxygen consumption, so ICP rises mildly. No meaningful muscle relaxation. Does not trigger malignant hyperthermia. Lowers renal blood flow and urine output; hepatic flow falls less than with volatile agents."],["Toxicity","Oxidizes the cobalt of vitamin B12, inhibiting methionine synthetase (myelin) and thymidylate synthetase (DNA). Prolonged exposure can cause megaloblastic anemia and neuropathy. May impair neutrophil function. Ozone-depleting greenhouse gas."],["Contraindications","About 35 times more soluble than nitrogen, so it enters closed gas spaces faster than nitrogen leaves: pneumothorax, bowel obstruction, air embolism, pneumocephalus, pulmonary air cysts, intraocular gas, middle-ear grafts. It also diffuses into endotracheal cuffs."],["Interactions","Changing the nitrous oxide fraction changes the volatile concentration delivered at a fixed vaporizer setting. It attenuates the circulatory and respiratory effects of volatile agents in adults."]]],
["Halothane",8,"22–26","Classic halogenated alkane volatile anesthetic, nonflammable, with strong bronchodilating properties and relatively high blood solubility compared with modern ethers. Provides smooth inhalation induction historically valued in pediatrics, but myocardial depression and sensitizing effects on the heart to catecholamines are prominent.","Historically used for mask induction and maintenance, especially in children. Now largely replaced by sevoflurane where available, but remains important to understand for legacy practice, toxicity teaching, and comparisons of volatile pharmacology.","Dose-dependent myocardial depression and baroreflex blunting; ventricular irritability with epinephrine (classic caution around 1.5 mcg/kg exogenous epinephrine). Triggers malignant hyperthermia. Rare immune hepatitis after repeated exposure—risk higher in middle-aged obese women and those with prior unexplained post-halothane liver injury.",[["Cardiovascular","At 2 MAC in non-surgical patients, blood pressure and cardiac output fell by 50%. Blunts the baroreflex; may cause junctional rhythm or bradycardia. In infants it lowers cardiac output through lower heart rate and contractility."],["Respiratory","Rapid shallow breathing, lower alveolar ventilation, higher PaCO2 and apneic threshold. Hypoxic drive is severely depressed even at 0.1 MAC. Bronchodilation is not blocked by β-blockers. Reduces mucociliary clearance."],["CNS","Dilates cerebral vessels, raising blood flow and volume, and blunts autoregulation. Establish hyperventilation before giving it to prevent ICP rise."],["Other organs","Relaxes muscle and potentiates nondepolarizing blockers. Triggers malignant hyperthermia. Lowers renal blood flow, GFR and urine output (preoperative hydration limits this). Hepatic blood flow falls with cardiac output; clearance of fentanyl, phenytoin and verapamil may be impaired."],["Metabolism and toxicity","Oxidized by CYP2E1 to trifluoroacetic acid. Reductive metabolism under low oxygen, especially after enzyme induction by barbiturates, produces hepatotoxic products. Risk factors for hepatitis: repeated exposures at short intervals, middle-aged obese women, personal or family history. Features include eosinophilia, rash and fever, with an immune response against trifluoroacetylated liver proteins."],["Contraindications","Unexplained liver dysfunction after a prior exposure; intracranial mass lesions (only with modest hyperventilation); hypovolemia or severe left ventricular dysfunction; pheochromocytoma or use of exogenous epinephrine."],["Interactions","Myocardial depression worsens with β-blockers and calcium channel blockers. Blood pressure swings and arrhythmias with tricyclics and MAO inhibitors (not absolute contraindications). Ventricular arrhythmias with aminophylline."]]],
["Isoflurane",8,"26–27","Halogenated ether volatile agent with a pungent ethereal odor. Provides maintenance anesthesia with relatively stable cardiac output because heart rate often rises as systemic vascular resistance falls. Potentiates neuromuscular blockade and can trigger malignant hyperthermia.","Widely used for maintenance of general anesthesia. Less ideal for inhalation induction because of airway pungency. Useful when controlled hypotension or bronchodilation is desired within a balanced technique.","Rapid concentration increases can cause transient sympathetic activation (HR/BP/catecholamines). Vasodilation is poorly tolerated in severe hypovolemia. Above ~1 MAC, cerebral blood flow and ICP may rise (usually less than with halothane). Triggers MH; epinephrine allowances are higher than with halothane but still require judgment.",[["Cardiovascular","Minimal left ventricular depression. Cardiac output is kept up by a higher heart rate (partly preserved baroreflex), while vascular resistance and pressure fall. Mild coronary dilation; the old coronary steal concern has largely been forgotten."],["Respiratory","Less tachypnea than other volatiles, so minute ventilation falls more. Blunts hypoxic and hypercapnic responses at 0.1 MAC. Irritates the airway yet bronchodilates, slightly less than halothane."],["CNS","Above 1 MAC raises CBF and ICP, less than halothane, and hyperventilation need not be started beforehand. Lowers cerebral oxygen use; isoelectric EEG at 2 MAC."],["Other organs","Relaxes muscle. Lowers renal blood flow, GFR and urine output. Hepatic artery perfusion is preserved and liver tests are usually unaffected."],["Metabolism and toxicity","Metabolized to trifluoroacetic acid. Fluoride may rise, even with prolonged ICU sedation, but nephrotoxicity is extremely unlikely. Little oxidative metabolism limits hepatic risk."],["Interactions","Epinephrine can be given up to 4.5 mcg/kg. Potentiates nondepolarizing blockers."]]],
["Desflurane",8,"27–30","Fluorinated ether closely related to isoflurane, with very low blood/gas solubility (about 0.42) enabling rapid titration and emergence. High vapor pressure near atmospheric at room temperature requires an electrically heated, pressurized vaporizer. Relatively low potency (MAC near 6%).","Chosen for maintenance when rapid control of depth and faster wake-up are priorities (emergence often substantially faster than isoflurane). Poor choice for inhalation induction because of pungency and airway irritation.","Rapid inspired increases provoke sympathetic surges (tachycardia, hypertension) more than isoflurane—attenuate with opioids or beta-blockade when needed. Desiccated CO2 absorbent can generate carbon monoxide. Airway irritation, possible laryngospasm on induction, MH trigger, and environmental impact are additional concerns.",[["Cardiovascular","Like isoflurane: vascular resistance and pressure fall, cardiac output little changed at 1–2 MAC, moderate rise in heart rate, CVP and PA pressure. Rapid increases cause transient tachycardia, hypertension and catecholamine rise, more than isoflurane, attenuated by fentanyl, esmolol or clonidine."],["Respiratory","Lower tidal volume, higher rate, lower alveolar ventilation, higher PaCO2. Induction can cause salivation, breath-holding, cough and laryngospasm; airway resistance may rise in children with reactive airways."],["CNS","Vasodilates cerebral vessels but cerebral oxygen use falls, so flow stays adequate at a mean pressure of 60 mm Hg. ICP can be lowered by hyperventilation. EEG shows burst suppression at high concentration."],["Other organs","Dose-dependent decrease in train-of-four response. No significant nephrotoxicity or hepatic effect."],["Metabolism and toxicity","Minimal metabolism; fluoride unchanged. Degraded by desiccated CO2 absorbent, especially barium hydroxide lime, into carbon monoxide. Suspect it with carboxyhemoglobin or unexpectedly low pulse oximetry. Discard dried absorbent. Most ozone-depleting volatile."],["Contraindications","Severe hypovolemia, malignant hyperthermia, intracranial hypertension."],["Interactions","Potentiates nondepolarizing blockers like isoflurane. Epinephrine up to 4.5 mcg/kg. Switching from isoflurane late in the case does not speed recovery or PACU discharge. Emergence delirium in some children."]]],
["Sevoflurane",8,"30–32","Fluorinated ether with low-to-moderate blood solubility (blood/gas ~0.65), nonpungent odor, and conventional vaporizer requirements. Favors smooth inhalation induction and relatively rapid emergence compared with older soluble agents.","Preferred volatile for inhalation induction in children and many adults (commonly high inspired concentrations briefly, then maintenance near 1 MAC). Used for maintenance whenever a less pungent agent is preferred; emergence is faster than isoflurane though PACU discharge times may not always differ.","Compound A forms with some strong-base absorbents especially at low flows/heat/dry absorbent—many clinicians keep fresh-gas flow ≥2 L/min for long cases. Fluoride release from metabolism rarely causes clinical nephropathy. May prolong QT in infants transiently. MH trigger; avoid in susceptible patients and in severe hypovolemia/ICP crises when volatiles are undesirable.",[["Cardiovascular","Mild myocardial depression. Vascular resistance and pressure fall slightly less than with isoflurane or desflurane, but little heart rate rise means cardiac output is less well maintained. May prolong QT (in infants up to 60 min after emergence)."],["Respiratory","Depresses respiration and reverses bronchospasm similarly to isoflurane."],["CNS","Slight rise in CBF and ICP at normocarbia. Above 1.5 MAC may impair autoregulation, less than isoflurane. No seizure activity reported."],["Other organs","Relaxation is adequate for intubation after inhalation induction, though most clinicians deepen anesthesia or add a blocker. Slightly lowers renal blood flow. Hepatic artery flow rises as portal flow falls, keeping total flow; not linked to immune hepatotoxicity."],["Metabolism and toxicity","About 5% is metabolized (CYP2E1, inducible by ethanol and phenobarbital). Fluoride exceeds 50 μmol/L in about 7% of patients without clinically significant kidney dysfunction. Compound A forms with barium hydroxide lime or soda lime (not calcium hydroxide), more with low flows, heat, dry absorbent and long cases; no known human harm, though some advise fresh gas flow of at least 2 L/min in cases lasting several hours. Hydrogen fluoride from impurities is minimized by added water and plastic packaging. Rare circuit fires with desiccated absorbent."],["Contraindications","Severe hypovolemia, susceptibility to malignant hyperthermia, intracranial hypertension."],["Interactions","Potentiates nondepolarizing blockers. Does not sensitize the heart to catecholamine arrhythmias."]]],
["Xenon",8,"33","Inert noble gas anesthetic that inhibits NMDA receptors partly by competing at the glycine site. Extremely low blood/gas coefficient (~0.115) yields very fast onset and offset. MAC is high (~71%), so potency is limited and high inspired fractions are needed.","Rarely available clinically because of cost and supply. When used, it offers hemodynamic gentleness and rapid recovery; research interest includes delirium reduction and possible neuroprotection compared with some volatiles.","Economics and low potency restrict routine use. Does not trigger malignant hyperthermia and is not ozone-depleting. Still requires oxygen planning because high xenon fractions reduce available FiO2.",[]],

["Thiopental",9,"37–41","Ultrashort-acting barbiturate that potentiates GABA-A signaling, is highly lipid soluble, and produces rapid hypnosis after IV injection. After a single bolus, awakening is driven mainly by redistribution from brain to muscle/fat rather than by metabolism. Repeated or infused doses saturate peripheral compartments so duration becomes elimination-dependent (context sensitivity).","Classic induction agent before propofol era; still conceptually important. Used for brief seizure control and historically for high-dose barbiturate coma / EEG burst-suppression strategies when cerebral metabolic suppression is the goal.","No intrinsic analgesia—may even be antanalgesic in small doses. Causes dose-dependent hypotension and apnea. Contraindicated in acute intermittent porphyria. Intra-arterial injection is catastrophic. Prolonged infusions delay awakening and may need cardiovascular support."],
["Methohexital",9,"37–41","Oxybarbiturate GABA-A potentiator with a methyl substitution that shortens clinical action after a bolus relative to thiopental and makes it less anticonvulsant than many barbiturates—hence its niche when a seizure is intentionally elicited.","IV induction alternative and the preferred barbiturate for electroconvulsive therapy in many protocols because seizure quality is better preserved than with more anticonvulsant agents. Rectal formulations were used historically for pediatric induction.","Myoclonus, hiccups, and excitatory movements are common. Pain on injection can occur. Same porphyria contraindication as other barbiturates. Still depresses respiration and blood pressure in a dose-related fashion."],
["Propofol",9,"53–55","IV hypnotic that enhances GABA-A activity and is formulated as a 1% lipid emulsion. Onset is rapid; offset after bolus is mainly redistribution. Provides antiemetic and anticonvulsant properties in addition to hypnosis, and supports TIVA/TCI techniques.","First-line induction for most adults, maintenance by infusion for TIVA, and sedation for procedures or ICU (with institutional limits). Useful when rapid clear-headed recovery and low PONV are desired.","Vasodilation plus blunted baroreflex cause hypotension, especially in elderly or depleted patients. Apnea is common at induction doses. Injection pain is frequent. Strict asepsis is mandatory; opened emulsion supports bacterial growth—follow time limits (commonly within 6–12 h per label/institution). Propofol infusion syndrome is a rare but lethal risk with prolonged high-rate infusions (metabolic acidosis, rhabdomyolysis, cardiac failure)."],
["Etomidate",9,"50–52","Imidazole GABA-A modulator dissolved typically in propylene glycol. Produces hypnosis with remarkable hemodynamic stability because it largely preserves sympathetic tone and myocardial contractility compared with propofol or thiopental.","Induction of choice when arterial pressure and cardiac output must be protected (shock, severe cardiac disease), accepting that laryngoscopy responses still need opioid or other supplementation because anesthetic depth for airway instrumentation may be light.","Transient inhibition of 11-β-hydroxylase suppresses cortisol/aldosterone synthesis even after a single induction dose; avoid infusions for ICU sedation. Myoclonus, PONV, and injection pain are common. Does not blunt sympathetic response to intubation by itself."],
["Ketamine",9,"","Phencyclidine-derivative NMDA antagonist producing dissociative anesthesia: eyes may remain open with preserved airway reflexes at some doses while awareness of external stimuli is disconnected. Also provides profound analgesia and can raise endogenous catecholamine tone.","Induction in hypovolemic or hemodynamically unstable patients, IM induction when IV access is delayed, procedural sedation/analgesia, opioid-sparing infusions, and treatment-resistant depression protocols (specialized settings). WHO lists it as an essential medicine.","Increases HR, BP, and cardiac output in most catecholamine-intact patients; direct myocardial depression can appear in depleted shock. Emergence delirium/agitation is common without co-sedation. Hypersalivation—pair with glycopyrrolate/atropine as needed. ICP/IOP effects are context-dependent; avoid casual use in uncontrolled intracranial hypertension without a full plan."],
["Midazolam",9,"","Water-soluble benzodiazepine that potentiates GABA-A. After IV bolus, clinical sedation/amnesia appear quickly; offset after single doses is largely redistribution. Synergizes strongly with opioids for hypnosis and respiratory depression.","Premedication, procedural sedation, anxiolysis, anterograde amnesia, co-induction, and acute seizure management. Preferred perioperative benzodiazepine because of reliable IV kinetics compared with diazepam.","Respiratory depression and airway obstruction—especially with opioids or in COPD/OSA/elderly. Can cause paradoxical agitation. Reverse with flumazenil when appropriate, remembering flumazenil’s shorter effect may allow resedation."],
["Diazepam",9,"","Highly lipophilic benzodiazepine with active metabolites (including desmethyldiazepam) that prolong sedation. GABA-A positive modulator with anxiolytic, anticonvulsant, and muscle-relaxant properties.","Anxiolysis, muscle spasm, and seizure control. Less often used for induction than midazolam because of long residual effects and formulation issues.","Prolonged sedation in elderly and hepatic impairment. Propylene-glycol IV formulations can cause pain and, in large amounts, toxicity. Additive CNS/respiratory depression with other sedatives."],
["Lorazepam",9,"","Benzodiazepine with reliable anticonvulsant efficacy and no clinically important active metabolites, so duration is more predictable in hepatic disease than diazepam, though redistribution/elimination still yield lasting sedation.","Status epilepticus protocols, ICU sedation/anxiolysis, and perioperative sedation when a longer benzodiazepine effect is acceptable.","IV onset is slower than midazolam. Prolonged sedation and respiratory depression with opioids. Contains solvents in some IV products—follow institutional dilution/administration rules."],
["Dexmedetomidine",9,"55–57","Highly selective central α2-adrenergic agonist producing sedation resembling natural sleep, anxiolysis, and modest analgesia with usually preserved respiratory drive compared with GABA agonists. Not a complete general anesthetic by itself.","ICU and procedural sedation, opioid-sparing adjunct in OR, awake fiberoptic intubation adjunct, and pediatric emergence-agitation strategies. Loading doses are optional and often omitted to limit bradycardia.","Bradycardia and hypotension are the dominant adverse effects; hypertension can occur with rapid loading. Use caution in high-degree AV block, volume depletion, and when vasoconstrictors/inotropes are already tenuous."],

["Morphine",10,"","Prototype μ-opioid receptor agonist providing analgesia and some sedation. Histamine release is more noticeable than with fentanyl-class phenylpiperidines. Active metabolite morphine-6-glucuronide is a potent opioid cleared by the kidney.","Perioperative and postoperative analgesia, including PCA. Longer clinical effect after dosing than fentanyl makes it useful when sustained analgesia is desired.","Respiratory depression, nausea, pruritus, biliary spasm, and hypotension from histamine or reduced sympathetic tone. In renal failure, M6G accumulation can cause delayed, prolonged narcosis—reduce dose or choose another opioid."],
["Meperidine",10,"68–72","Synthetic opioid with μ agonism plus anticholinergic and local-anesthetic–like properties. Historically popular for shivering and labor analgesia; metabolite normeperidine is neurotoxic.","Treatment of postoperative shivering remains a common niche. Analgesia use has declined because of metabolite risk and drug interactions.","Normeperidine accumulates with repeated dosing or renal impairment and can cause tremors, myoclonus, and seizures. Dangerous interaction with MAO inhibitors (excitation/serotonin syndrome). Anticholinergic effects and respiratory depression still occur."],
["Fentanyl",10,"66–68","High-potency, highly lipid-soluble μ agonist with rapid CNS penetration. After small boluses, offset is redistribution; large doses or long infusions extend duration as peripheral compartments fill.","Blunting of laryngoscopy/intubation responses, intraoperative analgesia in balanced anesthesia, epidural/spinal adjuncts (preservative-free), and ICU analgesia. Cornerstone opioid of modern anesthesia.","Dose-dependent respiratory depression and bradycardia. Rapid large IV boluses can cause chest-wall rigidity that impairs ventilation. Context-sensitive half-time rises with long infusions—plan emergence accordingly."],
["Sufentanil",10,"","Even more potent and lipid-soluble than fentanyl, providing intense analgesia with often stable hemodynamics when carefully titrated. Used where high opioid effect with smaller volume/dose mass is desired.","Major intra-abdominal, cardiac, and long procedures needing deep opioid analgesia. Infusion or bolus techniques depend on whether early extubation is planned.","Profound respiratory depression and delayed awakening after large cumulative doses. Rigidity and bradycardia possible. Requires ventilatory plan proportional to total dose."],
["Alfentanil",10,"","Shorter-acting μ agonist with lower pKa so a larger non-ionized fraction at physiologic pH yields very rapid onset. Less accumulation than fentanyl for brief cases when infusion is stopped appropriately.","Brief intense stimulation (intubation, short procedures), and infusions for ambulatory or intermediate-length cases when rapid titration is useful.","Respiratory depression, bradycardia, and muscle rigidity similar to other phenylpiperidines. Synergistic depression with hypnotics."],
["Remifentanil",10,"68–69","Ultrashort μ agonist rapidly hydrolyzed by nonspecific plasma and tissue esterases. Context-sensitive half-time remains short even after long infusions, so offset is predictably fast once the infusion stops.","TIVA partner with propofol, neurosurgery when neurologic assessment is needed quickly, and any case wanting intense intraoperative opioid effect without lingering respiratory depression.","Virtually no residual analgesia after discontinuation—start multimodal/longer opioid cover before stopping. Bradycardia, hypotension, and rigidity with boluses. Acute tolerance and opioid-induced hyperalgesia can appear after high-dose infusions."],
["Hydromorphone",10,"","Semi-synthetic μ agonist roughly several-fold more potent than morphine with typically less histamine release. Active metabolites are less problematic than morphine-6-glucuronide, though caution in organ failure remains.","IV titration, PCA, and perioperative analgesia when morphine’s histamine effects or metabolites are undesirable.","Respiratory depression, sedation, nausea, and pruritus still occur. Accumulate risk exists in renal/hepatic impairment—titrate carefully."],
["Naloxone",10,"63","Competitive antagonist at opioid receptors that can rapidly reverse opioid-induced respiratory depression and sedation. Onset IV is fast; duration is often shorter than that of many agonists.","Emergency reversal of life-threatening opioid respiratory depression in OR/PACU/ICU and community overdose settings. Titrate to ventilation, not necessarily to full analgesia wipe-out.","Abrupt full reversal can precipitate severe pain, sympathetic surge, pulmonary edema, arrhythmias, and agitation. Renarcotization occurs when agonist outlasts naloxone—observe and consider infusion."],

["Succinylcholine",11,"","Only clinically used depolarizing neuromuscular blocker. Binds nicotinic receptors, causes fasciculations then flaccid paralysis. Ultra-rapid onset and short duration in patients with normal plasma cholinesterase because the drug is hydrolyzed in plasma.","Gold-standard for rapid-sequence intubation when no contraindication exists and immediate airway control is needed. Also used for brief relaxation (e.g., electroconvulsive therapy) in selected patients.","Life-threatening hyperkalemia in burns, crush, denervation, prolonged ICU immobility, and some myopathies. Triggers MH and masseter spasm. Bradycardia especially with repeat doses in children. Prolonged paralysis with atypical cholinesterase. Increases IOP/intragastric pressure transiently."],
["Rocuronium",11,"","Aminosteroid nondepolarizing blocker with the fastest onset among commonly used nondepolarizers when high intubating doses are given. Intermediate duration; reversed by sugammadex (encapsulation) or by anticholinesterases once recovery begins.","Routine intubation and surgical relaxation; high-dose regimen is the main nondepolarizing RSI alternative when succinylcholine is contraindicated.","Anaphylaxis risk among NMBAs is discussed in literature—prepare for treatment. Duration prolongs with hepatic disease and with potent inhaled anesthetics. Deep block needs sugammadex or waiting for spontaneous recovery before neostigmine."],
["Vecuronium",11,"","Intermediate-acting aminosteroid nondepolarizer with minimal histamine release and little cardiovascular effect at usual doses. Onset slower than high-dose rocuronium.","Surgical relaxation for intermediate-length procedures and infusions in selected settings. Attractive when hemodynamic neutrality is desired.","Prolonged block in hepatic failure and with long infusions (active metabolite). Renal failure also extends duration. Reverse appropriately for residual paralysis."],
["Pancuronium",11,"","Long-acting aminosteroid blocker with vagolytic properties that raise heart rate and sometimes blood pressure. Historically common; now largely replaced by intermediate agents.","Long operations when lasting relaxation was acceptable and early reversal was not required. Teaching value for understanding long-acting NMBA pharmacology.","Tachycardia/hypertension from vagolysis. Markedly prolonged in renal failure. Residual paralysis risk if reversed too early or inadequately monitored."],
["Atracurium",11,"","Benzylisoquinolinium nondepolarizer cleared by Hofmann elimination (pH/temperature dependent) plus ester hydrolysis—useful when organ-independent clearance is desired. Intermediate duration.","Relaxation when hepatic/renal function is impaired. Historical ICU infusions (cisatracurium now often preferred for less histamine release).","Rapid large boluses cause histamine release: flushing, hypotension, bronchospasm. Laudanosine metabolite theoretically seizurogenic at very high prolonged exposure. Temperature/pH affect Hofmann rate."],
["Cisatracurium",11,"","Stereoisomer of atracurium with Hofmann-predominant elimination, minimal histamine release at clinical doses, and intermediate duration. Preferred organ-independent NMBA in many centers.","OR relaxation and ICU infusions, especially in multiorgan failure where predictable clearance without histamine release is valued.","Still causes weakness/paralysis risks of any NMBA. Onset slower than rocuronium for RSI-type timing. Reverse with neostigmine only after adequate spontaneous recovery; sugammadex does not encapsulate it."],
["Mivacurium",11,"","Short-acting benzylisoquinolinium hydrolyzed by plasma cholinesterase, yielding spontaneous recovery faster than intermediate agents when enzyme activity is normal.","Short procedures wanting quick return of neuromuscular function without routine sugammadex use (availability varies by country).","Histamine release with rapid boluses. Markedly prolonged block if plasma cholinesterase is deficient or inhibited. Not ideal when enzyme status is unknown and short paralysis is mandatory."],

["Neostigmine",12,"124–132","Quaternary cholinesterase inhibitor that increases acetylcholine at the neuromuscular junction to overcome residual nondepolarizing block. Does not work well from deep block because open receptors are too few.","Standard pharmacologic reversal of intermediate/long nondepolarizing block once TOF shows adequate spontaneous recovery (commonly ≥2 twitches, ideally higher ratios before PACU).","Muscarinic effects (bradycardia, secretions, bronchospasm, nausea)—always pair with atropine or glycopyrrolate. Ceiling effect; overdose can paradoxically weaken. Ineffective for deep block—use sugammadex for aminosteroids or wait."],
["Edrophonium",12,"","Short-acting cholinesterase inhibitor with rapid onset historically used to reverse shallow residual block or in diagnostic testing (e.g., myasthenia challenges in older algorithms).","Largely replaced by neostigmine/sugammadex for routine OR reversal, but pharmacologically illustrates rapid AChE inhibition.","Brief duration may allow recurarization if the NMBA outlasts it. Muscarinic side effects—give with atropine. Not appropriate for deep neuromuscular block."],
["Pyridostigmine",12,"","Longer-acting cholinesterase inhibitor used primarily in chronic myasthenia gravis management; slower onset than edrophonium and less convenient than neostigmine for OR reversal.","Oral/IV myasthenia therapy. Occasional historical OR reversal use where available, but neostigmine remains the usual anticholinesterase for anesthesia.","Cholinergic side effects (muscarinic and, in excess, nicotinic weakness). Dosing for myasthenia must not be confused with single OR reversal doses."],
["Sugammadex",12,"129–133","Modified γ-cyclodextrin that forms a tight complex with rocuronium (and vecuronium), removing free drug from the neuromuscular junction and allowing recovery even from deep block.","Reversal of aminosteroid block at any depth per labeled mg/kg tiers, including immediate reversal after high-dose rocuronium when succinylcholine was avoided.","Rare anaphylaxis and marked bradycardia (have atropine ready). May bind other steroids—counsel about reduced hormonal contraceptive efficacy for 7 days. Little/no efficacy for benzylisoquinoliniums (cisatracurium/atracurium)."],

["Atropine",13,"134–140","Tertiary amine antimuscarinic that crosses the blood–brain barrier. Blocks vagal effects on the heart and reduces secretions, with central as well as peripheral actions.","Treatment of bradycardia, antisialagogue use, and pairing with cholinesterase inhibitors to limit muscarinic side effects. ACLS bradycardia algorithms use weight/indication-based dosing.","Tachycardia, dry mouth, blurred vision/mydriasis, urinary retention, and central anticholinergic delirium—especially in elderly. Crosses placenta and BBB."],
["Glycopyrrolate",13,"139–140","Quaternary antimuscarinic that does not meaningfully cross the BBB, so peripheral antisialagogue and vagolytic effects occur with far less central delirium than atropine/scopolamine.","Preferred antisialagogue for many OR uses and the usual partner with neostigmine for reversal when avoiding central anticholinergic effects is desired.","Still causes dry mouth, thickened secretions, and some tachycardia (often less than atropine). Does not treat central anticholinergic needs because it stays peripheral."],
["Scopolamine",13,"","Tertiary antimuscarinic with strong central effects: sedation, amnesia, and antiemetic activity via vestibular and central pathways, plus peripheral drying.","Transdermal patch for PONV prophylaxis, premedication for drying/sedation in selected patients, and antisialagogue use when central effects are acceptable.","High delirium risk in elderly. Mydriasis, dry mouth, urinary retention. Patch should not contact eyes; wash hands after handling."],

["Epinephrine",14,"","Endogenous catecholamine agonizing α1/α2 and β1/β2 receptors. Low doses emphasize β effects (inotropy, chronotropy, bronchodilation); higher doses add strong vasoconstriction.","Anaphylaxis, cardiac arrest (ACLS), bronchospasm adjunct, septic/cardiogenic support infusions, and vasoconstrictor additive in local anesthetics to prolong block and reduce bleeding.","Arrhythmias, severe hypertension, myocardial ischemia, and pulmonary edema with overdose. Extravasation can necrose tissue. Volatile agents (especially halothane) sensitize myocardium to catecholamine arrhythmias."],
["Norepinephrine",14,"","Potent α1 agonist with meaningful β1 activity but little β2, producing vasoconstriction and supporting blood pressure while usually preserving or raising afterload.","First-line vasopressor in many vasodilatory shock states including septic shock after fluids. Infusion via reliable (preferably central) access.","Excessive vasoconstriction can impair gut/limb perfusion. Reflex bradycardia may occur. Extravasation injury risk—treat promptly. Titrate to MAP goals and lactate/perfusion, not dose number alone."],
["Dopamine",14,"","Endogenous catecholamine with dose-dependent receptor profile: dopaminergic at low rates, β at moderate, α vasoconstriction at high rates—though individual responses vary widely.","Historically used for shock with bradycardia or low cardiac output; many guidelines now prefer norepinephrine for septic shock. Still seen in some perioperative protocols.","Tachycardia and arrhythmias are common. Unpredictable receptor mix makes titration less tidy than pure agents. Extravasation risk at high concentrations."],
["Phenylephrine",14,"151–152","Selective α1 agonist causing arterial (and some venous) vasoconstriction without direct inotropy. Blood pressure rises; baroreflex often slows the heart rate.","Treatment of anesthesia-induced hypotension, especially after spinal/epidural or propofol induction when SVR falls and heart rate is not already low. Infusion for ongoing vasoplegia.","Reflex bradycardia can reduce cardiac output—problematic in low-output states. Pure afterload rise may stress a failing left ventricle. Extravasation injury possible."],
["Ephedrine",14,"154","Mixed direct and indirect sympathomimetic that releases norepinephrine and also has direct receptor effects. Raises HR and BP; useful when both are low.","Bolus treatment of general or spinal anesthesia hypotension, particularly when bradycardia accompanies low BP. Bridging while preparing infusion agents.","Tachyphylaxis appears as neuronal NE stores deplete. Tachycardia and hypertension with stacking doses. Caution with MAO inhibitors and uncontrolled hypertension/CAD."],
["Dobutamine",14,"155","Synthetic catecholamine with predominant β1 inotropy/chronotropy and some β2-mediated vasodilation; net effect often raises cardiac output with modest BP change.","Low-output states, cardiogenic shock adjuncts, and pharmacologic stress testing. Perioperative use when contractility support is the primary goal.","Tachycardia and arrhythmias limit dosing. Vasodilation may drop DBP/coronary perfusion pressure. Not a pure vasopressor—combine thoughtfully if SVR is already low."],
["Isoproterenol",14,"","Nonselective β agonist (β1 and β2) producing chronotropy, inotropy, and vasodilation. Historically important for bradycardia before pacing widespread availability.","Temporizing chronotrope for symptomatic bradycardia/heart block when pacing is not immediately available, and selected pulmonary hypertension or beta-blocker overdose contexts per protocol.","Marked tachycardia, arrhythmias, and diastolic hypotension from vasodilation. Increases myocardial oxygen demand—dangerous in ischemia."],
["Esmolol",14,"158–159","Cardioselective β1 blocker hydrolyzed by red-cell esterases, yielding an ultrashort half-life ideal for titrated perioperative rate control.","Blunting intubation/surgical sympathetic responses, treating intraoperative tachycardia/hypertension with a β-blocker, and short ICU rate control trials.","Bradycardia, hypotension, and heart failure exacerbation. Even selective agents can provoke bronchospasm in reactive airways—start low and monitor. Effects dissipate quickly after stopping infusion."],
["Labetalol",14,"","Combined α1 and nonselective β blocker that lowers blood pressure by reducing SVR and blunting reflex tachycardia. IV onset is useful for perioperative hypertensive urgencies.","Perioperative hypertension treatment with intermittent boluses or infusion when both α and β blockade are desired (e.g., some catecholamine-excess states).","Bradycardia, AV block, and bronchospasm risk from β-blockade. Avoid in decompensated heart failure and reactive airways disease exacerbations. Orthostatic hypotension after large doses."],
["Clonidine",14,"","Central α2 agonist that reduces sympathetic outflow, producing sedation, anxiolysis, modest analgesia, and lower anesthetic/opioid requirements. Also used as a regional anesthesia adjunct.","Oral premedication, opioid-sparing perioperative adjunct, treatment of hyperadrenergic states, and neuraxial/peripheral adjunct dosing in specialized recipes.","Sedation, bradycardia, hypotension. Chronic therapy must not be stopped abruptly—rebound hypertension can be severe. Adjust other antihypertensives accordingly."],
["Phentolamine",14,"","Competitive nonselective α-adrenergic antagonist causing vasodilation and reflex tachycardia. Used when excess α tone must be blocked acutely.","Perioperative pheochromocytoma blood-pressure control (often with beta-blockade sequenced properly) and local infiltration for catecholamine extravasation injuries.","Hypotension and reflex tachycardia. Beta-blockade without prior α-blockade in pheo can worsen hypertension—follow endocrine/anesthesia sequencing rules."],

["Nitroprusside",15,"165–172","Direct nitric-oxide donor dilating arteries and veins, producing immediate, titratable reductions in afterload and preload. Metabolized to cyanide then thiocyanate.","Hypertensive emergencies and controlled hypotension techniques when beat-to-beat arterial pressure control is required and an arterial line is in place.","Cyanide toxicity (metabolic acidosis, tachyphylaxis, CNS changes) with high/prolonged doses—use lowest rate and duration. Reflex tachycardia, rebound hypertension on sudden stop, increased ICP, and light-sensitive infusion bag requirements."],
["Nitroglycerin",15,"171–172","Organic nitrate that preferentially dilates veins at lower doses (↓preload) and dilates coronaries; arterial dilation increases as dose rises. Reduces myocardial wall tension and oxygen demand.","Myocardial ischemia, hypertensive states with high filling pressures, controlled hypotension, and uterine relaxation in selected obstetric emergencies (institutional protocols).","Headache, hypotension, reflex tachycardia, and tolerance with continuous infusion. Avoid with recent PDE-5 inhibitors. Right-ventricular infarct physiology may poorly tolerate preload reduction."],
["Hydralazine",15,"","Direct arteriolar smooth-muscle vasodilator that lowers SVR with little direct venodilation. Onset after IV bolus is slower than nitroprusside, with less precise minute-to-minute control.","Perioperative hypertension when afterload reduction is desired and reflex tachycardia can be tolerated or blunted. Common in obstetric hypertension algorithms alongside other agents.","Reflex tachycardia and increased cardiac output—caution in ischemia. Lupus-like syndrome with chronic oral therapy. Unpredictable delayed BP fall after stacking boluses."],
["Nicardipine",15,"174","Dihydropyridine calcium-channel blocker infusion providing arterial vasodilation with relatively little negative inotropy compared with non-dihydropyridines. Smooth perioperative BP control.","Perioperative and neurocritical hypertension management by continuous infusion with titration to arterial pressure targets.","Headache, flushing, reflex tachycardia, and phlebitis at infusion site. Accumulation can occur with long infusions—taper thoughtfully."],
["Clevidipine",15,"","Ultrashort dihydropyridine CCB formulated in lipid emulsion and cleared by plasma esterases, enabling rapid onset/offset arterial pressure titration similar in spirit to nitroprusside but without cyanide.","OR and ICU arterial hypertension when fine titration and quick offset are needed. Useful when nitroprusside cyanide risk is undesirable.","Reflex tachycardia, lipid load with prolonged high rates, and contraindications with soy/egg allergy or defective lipid metabolism. Monitor triglycerides on long infusions."],

["Lidocaine",16,"","Intermediate-acting amide local anesthetic blocking voltage-gated sodium channels. Also class Ib antiarrhythmic and IV adjunct that blunts airway reflexes and may reduce propofol pain/opioid needs.","Infiltration, peripheral nerve blocks, epidural anesthesia, topical airway anesthesia, IV induction adjunct, and ventricular arrhythmia treatment per ACLS/product labeling.","LAST (CNS excitation then depression, then cardiac toxicity) with overdose or intravascular injection—know lipid emulsion rescue. High spinal if epidurals migrate intrathecally. Methemoglobinemia rare vs prilocaine/benzocaine."],
["Bupivacaine",16,"","Long-acting, highly protein-bound amide LA with strong sensory anesthesia and substantial motor block at higher concentrations. Differentially more cardiotoxic than many amides if injected intravascularly.","Spinal anesthesia (hyperbaric/isobaric recipes), epidural labor/surgical analgesia, and peripheral nerve catheters/blocks needing long duration.","Intravascular injection can cause refractory ventricular arrhythmias and cardiovascular collapse—lipid emulsion is first-line therapy alongside ACLS modifications. Use incremental aspiration/dosing and ultrasound when applicable."],
["Ropivacaine",16,"194","S-enantiomer amide related to bupivacaine, designed for long blocks with relatively less cardiotoxicity and less dense motor block at equianalgesic sensory doses.","Epidural analgesia and peripheral nerve blocks when motor sparing and a potentially wider safety margin vs bupivacaine are desired.","LAST remains possible—do not treat as nontoxic. Still follow max-dose guidance, incremental injection, and lipid rescue readiness."],
["Mepivacaine",16,"","Intermediate-duration amide LA with onset similar to lidocaine and less intrinsic vasodilation, so epinephrine is often optional for infiltration/PNB duration.","Peripheral nerve blocks and infiltration when moderate duration without profound motor block prolongation is preferred.","LAST risk like other amides. Neonates handle it poorly—caution in obstetric contexts per product guidance. Follow mg/kg maxima."],
["Prilocaine",16,"","Amide LA with relatively favorable CNS toxicity profile among amides; component of EMLA topical cream. Metabolized to o-toluidine which can oxidize hemoglobin.","Infiltration, IV regional anesthesia (Bier block) where approved, and topical eutectic mixtures for skin anesthesia.","Dose-related methemoglobinemia—limits total dose especially in infants, anemia, or G6PD deficiency. Treat significant methemoglobinemia with methylene blue when appropriate."],
["Chloroprocaine",16,"","Rapid-onset, short-duration ester LA rapidly hydrolyzed by plasma cholinesterase, minimizing systemic toxicity duration when enzyme activity is normal. Popular for outpatient epidural and obstetric short procedures.","Epidural anesthesia for short cases and stages of labor when rapid offset aids ambulation/discharge. Preservative-free formulations matter for neuraxial use.","Large volumes in atypical cholinesterase patients prolong effect/toxicity. Historical neurologic injuries were linked to antioxidant/preservative-containing solutions—verify formulation before spinal use."],
["Tetracaine",16,"","Potent, long-acting ester LA used mainly for spinal anesthesia and some topical applications. High lipid solubility yields dense, prolonged block.","Spinal anesthesia for lower abdominal/perineal/lower extremity surgery with hyperbaric or isobaric preparations per kit. Historical topical airway/ophthalmic use with strict dose limits.","Systemic toxicity risk is high relative to milligram dose because of potency. Prolonged spinal block and hypotension from sympathectomy require monitoring. Avoid inadvertent IV injection."],

["Ondansetron",17,"220","Selective 5-HT3 receptor antagonist antiemetic acting peripherally on vagal afferents and centrally in the chemoreceptor trigger zone.","Prevention and treatment of PONV, and chemotherapy-associated nausea in broader practice. Often combined with dexamethasone for higher-risk PONV.","QT prolongation—caution with other QT drugs, electrolytes abnormalities, and congenital long QT. Headache and constipation are common mild effects."],
["Dexamethasone",17,"220","Long-acting corticosteroid with antiemetic efficacy for PONV (mechanism multifactorial), plus anti-inflammatory benefits for airway edema and some pain outcomes.","Single IV dose PONV prophylaxis, airway edema adjunct after traumatic intubation/airway surgery, and anti-inflammatory perioperative use per surgeon/anesthesia plans.","Hyperglycemia—important in diabetics. Rapid IV push can cause transient perineal pruritus/burning. Immunologic/wound concerns are usually minimal with single doses but matter in selected patients."],
["Metoclopramide",17,"","Dopamine D2 antagonist with prokinetic effects via enhanced gastric emptying and increased lower-esophageal sphincter tone; also antiemetic at CTZ.","PONV treatment/prevention and acceleration of gastric emptying when residual gastric volume is a concern and obstruction is excluded.","Extrapyramidal reactions and akathisia (treat with diphenhydramine/benztropine per protocol). Avoid in complete bowel obstruction and Parkinson disease. Black-box warnings exist for tardive dyskinesia with chronic use."],
["Droperidol",17,"","Butyrophenone dopamine antagonist antiemetic; historically paired with fentanyl for neurolept anesthesia. Effective for PONV at low doses.","Low-dose PONV prophylaxis/treatment when QT risk is screened and institutional policy allows. Alternative when 5-HT3 drugs fail in some algorithms.","FDA boxed warning regarding QT prolongation—obtain ECG screening policies per hospital. Dysphoria, sedation, and rare extrapyramidal effects."],
["Flumazenil",17,"228–229","Competitive antagonist at the benzodiazepine site on GABA-A receptors, reversing benzodiazepine-induced sedation and respiratory depression.","Reversal of iatrogenic benzodiazepine oversedation in monitored settings. Not a routine ‘wake-up’ drug for every sedated patient without indication.","Shorter action than many benzodiazepines → resedation. Can precipitate seizures in chronic benzodiazepine users or mixed overdoses (especially TCA). Titrate and monitor."],
["Dantrolene",17,"","Interferes with ryanodine-receptor–mediated calcium release from sarcoplasmic reticulum in skeletal muscle, directly treating the pathophysiology of malignant hyperthermia crisis.","Immediate IV therapy for suspected MH per MH cart/protocol; continue until metabolic stability. Also used in selected spasticity and neuroleptic malignant syndrome contexts (different regimens).","Muscle weakness can impair ventilation postoperatively. Chronic oral therapy risks hepatotoxicity—monitor LFTs. Know your institution’s MH kit concentration (legacy vs reformulated) to avoid reconstitution delays."],
["Ketorolac",17,"","Potent parenteral NSAID inhibiting COX and prostaglandin synthesis, providing opioid-sparing somatic analgesia without respiratory depression.","Short-course postoperative analgesia as part of multimodal regimens when bleeding and renal risk are acceptable.","Impairs platelet function and can increase surgical bleeding. Nephrotoxicity risk in hypovolemia, elderly, ACE-inhibitor users. GI ulceration—limit dose and duration (often ≤5 days). Avoid in CABG peri-operative settings per labeling."]
];



var DOSE={
"Nitrous oxide":"As an analgesic/adjunct, inspired concentrations commonly fall in the 50–70% range with oxygen, remembering MAC is ~104% so nitrous alone is incomplete for surgery. A rule of thumb taught clinically is that ~65% inspired N2O can reduce volatile MAC by about half. Always leave enough FiO2 for the patient’s oxygenation needs, and never use it when closed gas spaces are a concern. Dental/labor ‘relative analgesia’ techniques use lower concentrations with continuous verbal contact and scavenging.",
"Halothane":"MAC is approximately 0.75% in middle-aged adults (higher in infants, lower in elderly). Maintenance inspired concentrations are often roughly 0.5–1.5% titrated to BP/HR and anesthetic depth. Induction historically used higher inspired fractions then stepped down. If injecting epinephrine for hemostasis, classic teaching limits total exogenous epinephrine (about 1.5 mcg/kg) because of arrhythmia risk. Reduce dose expectations in hypovolemia because myocardial depression is poorly tolerated.",
"Isoflurane":"Adult MAC is near 1.15–1.2%. Maintenance commonly uses about 0.5–1.5% inspired (roughly 0.5–1.5 MAC depending on adjuvants like opioids/N2O). Titrate slowly—rapid increases cause sympathetic surges. Epinephrine for infiltration is generally better tolerated than with halothane (classic upper teaching value around 4.5 mcg/kg), still with ECG vigilance. Age, temperature, and adjuvants shift MAC substantially.",
"Desflurane":"MAC is approximately 6% in young adults. Maintenance often runs near 2–6% inspired or ~0.5–1 MAC once adjuvants are considered. Increase the vaporizer in small steps; large sudden jumps provoke tachycardia/hypertension. Requires the dedicated heated vaporizer—cannot be poured into a standard variable-bypass vaporizer. Plan FiO2 and FGF as with other volatiles; discard desiccated absorbent to avoid CO generation.",
"Sevoflurane":"MAC ~2% in adults. Inhalation induction commonly uses 4–8% briefly in O2 or O2/N2O until IV access/airway control, then maintenance near 1–3% inspired (~0.5–1.5 MAC with adjuvants). For long anesthetics with barium hydroxide lime/soda lime, many clinicians keep fresh-gas flow at least 2 L/min to limit Compound A exposure. Pediatric MAC is higher—titrate to age.",
"Xenon":"MAC ~71%, so inspired fractions approaching this value are needed for surgical depth, which constrains FiO2. Delivery usually needs closed-circuit or reclaim systems because of cost. Titrate like other inhaled agents to hemodynamic and processed-EEG/clinical depth targets when available. Emergence is expected to be very rapid after discontinuation.",
"Thiopental":"Adult IV induction is commonly 3–5 mg/kg (reduce to ~1–2 mg/kg or incremental dosing in elderly, ASA III–IV, hypovolemia, or shock). Small incremental doses (e.g., 50–100 mg adults) can briefly abort seizures. Continuous infusions for burst suppression are high-dose and prolong recovery—reserve for specific neuroprotective plans with hemodynamic support ready. Intra-arterial injection is a surgical emergency.",
"Methohexital":"IV induction often ~1–1.5 mg/kg in adults. For ECT, dosing is individualized to allow an adequate seizure—follow psychiatry/anesthesia protocol rather than a single universal mg/kg. Reduce doses with age and co-depressants. Have airway support ready for apnea and treat excitatory movements supportively.",
"Propofol":"Induction typically 1.5–2.5 mg/kg IV in healthy adults; use 0.5–1.5 mg/kg (or incremental) in elderly/debilitated. TIVA maintenance commonly 50–200 mcg/kg/min (or TCI effect-site targets per pump model). Procedural sedation uses lower boluses/infusions with continuous monitoring. Lidocaine pretreatment or mixing strategies reduce injection pain. Strict aseptic draw-up; discard per label time limits.",
"Etomidate":"Induction 0.2–0.3 mg/kg IV is standard. Does not replace opioids for laryngoscopy—add fentanyl/remifentanil or deepen otherwise. Avoid infusions for sedation because of adrenocortical suppression. Myoclonus can be reduced by pretreatment with a small opioid or benzodiazepine dose per practice pattern.",
"Ketamine":"IV induction commonly 1–2 mg/kg; IM induction ~4–6 mg/kg when no IV access. Analgesic infusions often start around 0.1–0.3 mg/kg/h after a small bolus (e.g., 0.1–0.5 mg/kg), titrated and protocolized. Emergence reactions decrease with midazolam co-administration. Give glycopyrrolate 0.01 mg/kg or atropine when hypersalivation is expected.",
"Midazolam":"Adult IV sedation often begins with 0.5–2 mg increments (≈0.01–0.03 mg/kg), waiting for peak before redosing. Premedication IM/oral regimens are weight-based in children. Co-induction with induction agents uses small IV doses (1–3 mg adults). Reduce by ≥50% with opioids, frailty, or OSA. Flumazenil available for rescue.",
"Diazepam":"IV anxiolysis/seizure dosing is incremental (often 2.5–5 mg adults) with continuous monitoring. Status epilepticus protocols use higher cumulative totals under airway readiness. Oral premedication doses vary widely (commonly 5–10 mg adults). Account for long metabolites—avoid stacking in elderly.",
"Lorazepam":"IV sedation commonly 0.02–0.06 mg/kg. Status epilepticus: follow AHA/institutional algorithms (often 4 mg IV adults, may repeat once). Onset slower than midazolam—do not stack rapidly. ICU infusions exist but propylene-glycol load and prolonged sedation require care.",
"Dexmedetomidine":"Optional load 0.5–1 mcg/kg over 10 minutes (skip if bradycardia risk). Maintenance infusion typically 0.2–0.7 mcg/kg/h; some ICU protocols allow up to ~1.5 mcg/kg/h briefly. Titrate to sedation score; reduce with bolus antihypertensives/beta-blockers. Have atropine/glycopyrrolate and vasopressors available.",
"Morphine":"IV titration commonly 0.05–0.1 mg/kg (adults often 2–5 mg q5–10 min to effect). PCA demand doses are institution-specific (e.g., 1 mg q6–10 min lockout). Epidural/spinal morphine uses much smaller preservative-free mg doses—never confuse routes. Cut dose sharply in renal failure or choose alternatives.",
"Meperidine":"Shivering: 12.5–25 mg IV adults is a common effective range. Analgesic dosing historically 0.5–1 mg/kg IV/IM, but prefer other opioids for repeated analgesia because of normeperidine. Absolute avoidance with MAO inhibitors. Limit cumulative dose and avoid in renal impairment.",
"Fentanyl":"Blunting intubation: commonly 1–3 mcg/kg IV 3–5 min before laryngoscopy. Intraoperative analgesia often 1–2 mcg/kg boluses or 1–3 mcg/kg/h infusions, scaled to case length. Induction for opioid-based cardiac techniques uses much larger totals with planned ventilation. Reduce with remifentanil co-infusion or frailty.",
"Sufentanil":"Potency ≈5–10× fentanyl—dose in mcg carefully. Boluses for intense analgesia often 0.1–0.5 mcg/kg; infusions commonly 0.2–1 mcg/kg/h depending on early extubation goals. Cardiac opioid anesthesia uses higher planned totals with postoperative ventilation. Always label clearly to avoid mg/mcg errors.",
"Alfentanil":"Intubation/brief stimuli: about 5–15 mcg/kg IV. Infusions often 0.5–1.5 mcg/kg/min with hypnotic infusions, stopped several minutes before end of short cases. Reduce with midazolam/propofol synergy. Watch rigidity if bolused rapidly.",
"Remifentanil":"Infusion typically 0.05–0.2 mcg/kg/min for maintenance; induction/intubation may use 0.5–1 mcg/kg over ≥30–60 s or higher transient rates. Ideal body weight dosing is often preferred in obesity. Before stopping, give morphine/hydromorphone/fentanyl or regional analgesia. Have glycopyrrolate/atropine for bradycardia.",
"Hydromorphone":"IV titration commonly 0.2–0.4 mg adult increments (≈0.01–0.02 mg/kg) q5–10 min. PCA settings are hospital-specific. Equianalgesic conversion from morphine is roughly 1 mg hydromorphone ≈ 5–7 mg morphine IV—verify with a conversion table. Reduce in elderly/organ failure.",
"Naloxone":"For postoperative opioid depression, start with 40–80 mcg IV adults and titrate every 2–3 minutes to ventilation while preserving analgesia if possible. Full 0.4 mg amples can fully reverse and provoke crisis—dilute for OR use. Infusion (e.g., 2–5 mcg/kg/h) if long-acting agonist. Pediatric dosing is weight-based per PALS/institutional cards.",
"Succinylcholine":"RSI intubation: 1–1.5 mg/kg IV ideal body weight commonly taught (some use total body weight—follow local airway policy). IM: ~3–4 mg/kg if no IV. Pretreat with small nondepolarizer ‘defasciculating’ dose only when indicated and timing understood. Absolute respect for hyperkalemia contraindications overrides any dosing discussion.",
"Rocuronium":"Standard intubation 0.6 mg/kg IV; RSI 1.0–1.2 mg/kg IV. Maintenance boluses ~0.1–0.2 mg/kg. Sugammadex dosing by depth: 2 mg/kg (reappearance of T2), 4 mg/kg (PTC 1–2), 16 mg/kg immediately after high-dose rocuronium. Without sugammadex, wait for spontaneous recovery before neostigmine.",
"Vecuronium":"Intubation 0.08–0.1 mg/kg IV; maintenance 0.01–0.015 mg/kg. Infusion rates approximate 0.8–1.2 mcg/kg/min with TOF guidance. Expect longer duration with volatile potentiation and organ dysfunction. Sugammadex can reverse; otherwise neostigmine after adequate twitches.",
"Pancuronium":"Historical intubation dose ~0.08–0.1 mg/kg IV with long clinical duration (≈60–90 min). Maintenance small increments 0.01–0.02 mg/kg. Prefer intermediate agents in modern practice. Plan for renal clearance delay and vagolytic tachycardia.",
"Atracurium":"Intubation 0.4–0.5 mg/kg IV over 30–60 s to limit histamine release; maintenance ~0.08–0.1 mg/kg q10–20 min or infusion ~5–10 mcg/kg/min. Hofmann elimination means hypothermia/acidosis prolongs block. Keep resuscitation drugs ready for histamine reactions.",
"Cisatracurium":"Intubation 0.15–0.2 mg/kg IV (onset slower than rocuronium). Maintenance 0.02–0.03 mg/kg. ICU infusion often 1–3 mcg/kg/min titrated to TOF. Excellent choice in multiorgan failure. Reverse only after spontaneous recovery begins if using neostigmine.",
"Mivacurium":"Intubation commonly 0.15–0.25 mg/kg IV, sometimes in divided doses to reduce histamine flush. Maintenance small increments or short infusion. If recovery is unexpectedly long, consider cholinesterase deficiency and support ventilation rather than stacking reversal early.",
"Neostigmine":"Usual reversal 0.04–0.07 mg/kg IV (many cap adult dose at 5 mg) mixed with glycopyrrolate ~0.2 mg per 1 mg neostigmine or atropine 0.01–0.02 mg/kg. Give only when TOF count is adequate (commonly ≥2, preferably train-of-four ratio recovery underway). Deep block: do not rely on neostigmine alone.",
"Edrophonium":"Historical reversal ~0.5–1.0 mg/kg IV with atropine ~0.014 mg/kg given first or together. Onset ~1 minute but duration short. Confirm sustained recovery with quantitative monitoring when available.",
"Pyridostigmine":"Myasthenia oral dosing is individualized (often tens to hundreds of mg/day in divided doses)—managed by neurology. IV myasthenia regimens differ from OR neostigmine reversal charts. Do not improvise OR reversal from chronic home doses without specialist guidance.",
"Sugammadex":"For rocuronium/vecuronium: 2 mg/kg when TOF shows T2; 4 mg/kg for deep block with PTC 1–2; 16 mg/kg for immediate reversal after 1.2 mg/kg rocuronium. Inject IV as bolus; expect rapid recovery. Recounsel contraceptive efficacy; observe for bradycardia/anaphylaxis.",
"Atropine":"Anesthesia bradycardia: often 0.4–1 mg IV adults (PALS pediatric minimum dosing rules differ—use weight-based cards). With neostigmine: ~0.015–0.02 mg/kg. Antisialagogue doses are smaller. ACLS pulseless algorithms use higher timed doses—follow the current ACLS card.",
"Glycopyrrolate":"Antisialagogue ≈0.005–0.01 mg/kg IV. With neostigmine, a common adult ratio is 0.2 mg glycopyrrolate per 1 mg neostigmine (≈0.01–0.02 mg/kg). Onset slower than atropine IV but less tachycardia/CNS effect. Avoid assuming CNS anticholinergic treatment—it does not cross BBB.",
"Scopolamine":"PONV patch: 1.5 mg transdermal applied ideally evening before or 2–4 h preop, remove within 24 h postop typically. IV/IM antisialagogue doses are small (e.g., 0.3–0.65 mg adults historically)—rarely first choice in elderly. Do not cut patches.",
"Epinephrine":"Anaphylaxis IM: 0.3–0.5 mg (1 mg/mL) adults q5 min PRN; IV infusions for refractory shock often start 0.05–0.2 mcg/kg/min. ACLS cardiac arrest: 1 mg IV/IO q3–5 min adults. Local anesthetic: commonly 5 mcg/mL (1:200,000). Confirm concentration every time before injection.",
"Norepinephrine":"Typical infusion 0.01–0.3 mcg/kg/min (some chart mcg/min). Start low and titrate to MAP/perfusion. Prefer central line; if peripheral temporarily, use proximal large vein and watch extravasation. Wean slowly to avoid rebound vasodilation.",
"Dopamine":"Traditional teaching: 1–5 mcg/kg/min dopaminergic, 5–10 β, >10–20 α—but overlap is large. Modern septic shock care often skips dopamine unless bradycardia-focused. Titrate to effect with arrhythmia surveillance.",
"Phenylephrine":"IV bolus 50–100 mcg adults (or 0.5–1 mcg/kg), repeat q1–2 min. Infusion roughly 0.1–1 mcg/kg/min or 20–80 mcg/min. Dilute carefully (commonly 100 mcg/mL syringe). Treat accompanying severe bradycardia with anticholinergic if needed.",
"Ephedrine":"IV bolus 5–10 mg adults, repeat carefully; total doses escalate tachyphylaxis. IM 25–50 mg sometimes used for longer effect. Prefer phenylephrine when tachycardia is undesirable, ephedrine when HR is low.",
"Dobutamine":"Infusion 2–20 mcg/kg/min via dedicated line. Start 2–5 mcg/kg/min and titrate to cardiac index/urine output/lactate. Combine with vasopressors if diastolic pressure falls excessively.",
"Isoproterenol":"Infusion often begins near 0.5–2 mcg/min adults (≈0.01–0.05 mcg/kg/min) and titrates to heart rate. Have defibrillator ready. Transition to pacing as definitive therapy for high-degree block when indicated.",
"Esmolol":"Load 0.5 mg/kg over ~1 minute if needed; infusion 50–200 mcg/kg/min. For intubation, small boluses 0.2–0.5 mg/kg or brief infusion spikes are used. Effects fade within minutes after stopping—re-dosing plan required.",
"Labetalol":"IV intermittent 5–20 mg over 2 minutes, repeat q5–10 min to cumulative institutional maxima (often 100–300 mg range). Infusion 0.5–2 mg/min. Patient must be supine; watch HR and bronchospasm.",
"Clonidine":"Oral premed commonly 0.1–0.3 mg adults 60–90 min preop. IV perioperative adjunct dosing is specialized. Epidural/peripheral adjunct concentrations follow regional recipe cards—do not invent neuraxial doses from oral charts. Continue or carefully substitute chronic clonidine to avoid rebound HTN.",
"Phentolamine":"IV boluses 1–5 mg adults for hypertensive surges in pheochromocytoma, repeated to effect with invasive BP monitoring. For extravasation: infiltrate 5–10 mg diluted in saline around the site per protocol. Ensure α-before-β blockade sequencing in pheo induction plans.",
"Nitroprusside":"Start ≈0.3 mcg/kg/min; usual range 0.5–2 mcg/kg/min; avoid prolonged rates >2 mcg/kg/min. Always arterial-line titration, light-protected tubing, and cyanide surveillance (acidosis, unexplained tachyphylaxis). Keep volume resuscitation ready for abrupt vasodilation.",
"Nitroglycerin":"Infusion start 5–10 mcg/min, titrate by 5–10 mcg/min to ischemia/BP goals (often 10–100+ mcg/min). Bolus small IV aliquots sometimes used perioperatively. Remove PDE-5 inhibitor contraindication history first. Glass bottles/special tubing may be required due to adsorption.",
"Hydralazine":"IV 5–10 mg adults over 1–2 minutes; repeat q20–30 minutes PRN because peak effect is delayed (10–20 min). Avoid stacking doses too quickly. Combine with beta-blocker if reflex tachycardia appears.",
"Nicardipine":"Start 5 mg/h IV; increase by 2.5 mg/h q5–15 min to a usual maximum near 15 mg/h, then reduce toward maintenance (often 3–5 mg/h) once target BP reached. Peripheral IV acceptable short-term; watch site reactions.",
"Clevidipine":"Initiate 1–2 mg/h; double every 90 seconds early until approaching goal, then smaller steps. Typical maintenance 4–6 mg/h; some need 10–20+ mg/h briefly. Account for lipid calories (0.2 g fat/mL). Contraindicated in egg/soy allergy.",
"Lidocaine":"Max recommended infiltration doses approx. 4.5 mg/kg without epinephrine and ~7 mg/kg with epinephrine (product label rules). IV induction adjunct 1–1.5 mg/kg. Bier block and tumescent techniques have separate limits—use specialty protocols. Antiarrhythmic ACLS dosing differs from anesthetic infiltration charts.",
"Bupivacaine":"Spinal doses are small (often 8–15 mg hyperbaric for many adult lower abdominal/lower limb recipes—follow kit). Epidural/PNB concentrations 0.25–0.5% common; max approx. 2–2.5 mg/kg. Never inject rapidly without aspiration/incremental dosing. Lipid emulsion 20% ready for LAST.",
"Ropivacaine":"PNB/epidural commonly 0.2% (analgesia) to 0.5–0.75% (dense block). Max approx. 3 mg/kg depending on source/label—use the conservative institutional limit. Continuous catheter rates are mL/h recipe-specific. Prepare for LAST despite improved safety margin.",
"Mepivacaine":"Infiltration/PNB 1–2% solutions; max roughly 5 mg/kg plain / up to ~7 mg/kg with epinephrine depending on label. Intermediate duration (~1.5–3 h). Avoid large doses in neonates/young infants.",
"Prilocaine":"Follow product-specific maxima; methemoglobinemia risk rises with higher total mg (classically concern as totals approach ~600 mg in adults, much lower in infants). EMLA apply thickly under occlusive dressing for prescribed time only. IVRA dosing uses dilute large volumes with tourniquet discipline.",
"Chloroprocaine":"Epidural 2–3% preservative-free solutions; volumes depend on block level (often 15–25 mL for surgical epidural in adults—titrate). Rapid hydrolysis shortens duration (~30–60 min). Confirm ‘preservative-free / neuraxial approved’ labeling before spinal use.",
"Tetracaine":"Spinal adult doses commonly in the 6–15 mg range depending on baricity and surgical level—use the specific spinal kit card. Topical mucosal doses must stay tiny because absorption is rapid. Hypotension from sympathectomy needs fluids/vasopressors ready.",
"Ondansetron":"Adults 4 mg IV at induction or end of case for PONV; may repeat with caution. Pediatrics typically 0.1 mg/kg (max 4 mg). Oral dissolving tablets 8 mg used in some ambulatory pathways. Check QTc-interacting meds.",
"Dexamethasone":"PONV prophylaxis commonly 4–8 mg IV after induction (some use 0.1 mg/kg). Airway edema adjunct doses vary (often 4–10 mg IV). Give slowly to reduce perineal burning. Single doses rarely need taper.",
"Metoclopramide":"Adults 10 mg IV over 1–2 minutes for PONV/prokinesis; pediatric ~0.1–0.15 mg/kg. Cap cumulative dosing and avoid chronic outpatient courses when possible due to tardive dyskinesia warning. Have diphenhydramine available for acute dystonia.",
"Droperidol":"Low-dose PONV: 0.625–1.25 mg IV adults. Higher classic antiemetic doses are largely abandoned because of QT concerns. Screen ECG risk; avoid with other QT-prolonging drugs when possible.",
"Flumazenil":"Initial 0.2 mg IV over 15–30 s; then 0.1–0.2 mg q1 min to usual total 1 mg for sedation reversal (higher totals only in specialized overdose care). Start infusion if resedation expected. Contraindicated relative to seizure risk in chronic benzo/TCA overdose—risk–benefit required.",
"Dantrolene":"MH crisis: 2.5 mg/kg IV rapid push, repeat until signs controlled (cumulative often up to 10 mg/kg). Then maintenance per MH association protocol (e.g., 1 mg/kg q4–6 h or infusion). Know whether your kit is older 20 mg vials (many sterile water flushes) or concentrated formulations. Call MH hotline.",
"Ketorolac":"Adults <65 y: 30 mg IV/IM q6h (max 120 mg/day) short course; ≥65 y or renal risk: 15 mg q6h (max 60 mg/day). Many anesthesiologists use a single 15–30 mg IV intraoperative dose. Hard stop at 5 days. Avoid if Cr elevated, bleeding risk high, or CABG setting."
};

var cat="all";
var q=document.getElementById("q");
var list=document.getElementById("list");
var cnt=document.getElementById("count");
var nav=document.getElementById("nav");
var chips=document.getElementById("chips");
var side=document.getElementById("side");
var backdrop=document.getElementById("backdrop");
var toastEl=document.getElementById("toast");
var byName={};
D.forEach(function(d){ byName[d[0]]=d; });

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t=setTimeout(function(){ toastEl.classList.remove("show"); }, 1400);
}
function closeMenu(){
  side.classList.remove("open");
  backdrop.classList.remove("show");
  backdrop.hidden=true;
  document.body.style.overflow="";
}
function flashBtn(btn){
  if(!btn) return;
  var old=btn.getAttribute("data-label") || btn.textContent;
  btn.setAttribute("data-label", old);
  btn.textContent="تم ✓";
  btn.classList.add("ok");
  setTimeout(function(){ btn.textContent=old; btn.classList.remove("ok"); }, 1100);
}
function writeText(text, btn){
  text=String(text||"");
  if(!text.trim()){ toast("لا يوجد نص"); return; }
  function ok(){ flashBtn(btn); toast("تم النسخ"); }
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=text;
    ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    var done=false;
    try{ done=document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    if(done) ok(); else toast("تعذر النسخ");
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(ok).catch(fallback);
  } else fallback();
}
function drugPlain(d){
  var lines=[d[0], "الفصل "+d[1]+" — "+C[d[1]].ar+" / "+C[d[1]].title, "", "الآلية: "+d[3], "", "الاستخدام: "+d[4], "", "Dosage: "+(DOSE[d[0]]||"—"), "", "التأثيرات والتحذيرات: "+d[5]];
  (d[6]||[]).forEach(function(e){ lines.push("", e[0]+": "+e[1]); });
  lines.push("", "د. منوّرة محمد جواد");
  return lines.join("\n");
}
function mkNav(){
  nav.innerHTML=""; chips.innerHTML="";
  function add(k, title, sub, chipLabel){
    var b=document.createElement("button");
    b.type="button";
    b.setAttribute("aria-pressed", String(k===cat));
    b.innerHTML='<span class="t">'+esc(title)+'</span><span class="s" dir="ltr" lang="en">'+esc(sub)+'</span>';
    b.onclick=function(){ cat=k; mkNav(); render(); closeMenu(); window.scrollTo({top:0,behavior:"smooth"}); };
    nav.appendChild(b);
    var c=document.createElement("button");
    c.type="button"; c.className="chip";
    c.setAttribute("aria-pressed", String(k===cat));
    c.textContent=chipLabel;
    c.onclick=function(){ cat=k; mkNav(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    chips.appendChild(c);
  }
  add("all","كل الفصول","Chapters 8–17","الكل");
  Object.keys(C).forEach(function(k){
    add(k, "الفصل "+k+" · "+C[k].ar, C[k].title, "ف "+k);
  });
}
function sectionHTML(titleAr, titleEn, text){
  var head=titleEn
    ? (esc(titleAr)+' <span class="meta-en" dir="ltr">· '+esc(titleEn)+'</span>')
    : '<span class="meta-en" dir="ltr">'+esc(titleAr)+'</span>';
  return '<div class="section">'+
    '<div class="section-head"><h3>'+head+'</h3>'+
    '<button type="button" class="copy-btn" data-kind="section">نسخ</button></div>'+
    '<p class="section-text" dir="ltr" lang="en">'+esc(text)+'</p></div>';
}
function card(d){
  var infoParts=[
    sectionHTML("الآلية","Mechanism", d[3]),
    sectionHTML("الاستخدام","Clinical use", d[4]),
    sectionHTML("التأثيرات والتحذيرات","Cautions", d[5])
  ];
  (d[6]||[]).forEach(function(e){ infoParts.push(sectionHTML(e[0], "", e[1])); });
  var doseText=DOSE[d[0]]?esc(DOSE[d[0]]):"—";
  return '<details class="drug" data-drug="'+esc(d[0])+'">'+
    '<summary><span class="dot" aria-hidden="true"></span><span class="nm" dir="ltr" lang="en">'+esc(d[0])+'</span><span class="ch">ف '+d[1]+'</span></summary>'+
    '<div class="body">'+
      '<div class="actions"><button type="button" class="copy-btn" data-kind="all" data-drug="'+esc(d[0])+'">نسخ الموضوع كاملاً</button></div>'+
      '<div class="tabs" role="tablist" aria-label="'+esc(d[0])+' tabs">'+
        '<button type="button" class="tab-btn" role="tab" data-tab="info" aria-selected="true">الشروحات</button>'+
        '<button type="button" class="tab-btn tab-dosage" role="tab" data-tab="dosage" aria-selected="false" dir="ltr" lang="en">Dosage</button>'+
      '</div>'+
      '<div class="tab-panel active" data-panel="info" role="tabpanel">'+infoParts.join("")+'</div>'+
      '<div class="tab-panel" data-panel="dosage" role="tabpanel">'+
        '<div class="section section-dosage">'+
          '<div class="section-head"><h3><span class="meta-en" dir="ltr" lang="en">Dosage</span></h3>'+
          '<button type="button" class="copy-btn" data-kind="section">نسخ</button></div>'+
          '<p class="section-text" dir="ltr" lang="en">'+doseText+'</p>'+
        '</div>'+
      '</div>'+
    '</div></details>';
}
function render(){
  var s=q.value.trim().toLowerCase();
  var groups={}; Object.keys(C).forEach(function(k){ groups[k]=[]; });
  var total=0;
  D.forEach(function(d){
    if(cat!=="all" && String(d[1])!==String(cat)) return;
    var hay=(d.join(" ")+" "+C[d[1]].title+" "+C[d[1]].ar).toLowerCase();
    if(s && hay.indexOf(s)<0) return;
    groups[d[1]].push(d); total++;
  });
  document.getElementById("statDrugs").textContent=D.length+" دواء";
  cnt.textContent=total+" نتيجة"+(cat==="all"?"":" · الفصل "+cat);
  if(!total){
    list.innerHTML='<p class="empty">لا توجد نتائج مطابقة.</p>';
    return;
  }
  var html="";
  Object.keys(C).forEach(function(k){
    var arr=groups[k]; if(!arr.length) return;
    html+='<section class="chapter" id="ch-'+k+'">'+
      '<div class="chapter-head"><h2>الفصل '+k+': '+esc(C[k].ar)+'</h2>'+
      '<span class="meta meta-en" dir="ltr" lang="en">'+esc(C[k].title)+' · '+arr.length+'</span></div>'+
      '<div class="grid">'+arr.map(card).join("")+'</div></section>';
  });
  list.innerHTML=html;
}

list.addEventListener("click", function(e){
  var tab=e.target.closest(".tab-btn");
  if(tab){
    e.preventDefault();
    e.stopPropagation();
    var body=tab.closest(".body");
    if(!body) return;
    var which=tab.getAttribute("data-tab");
    body.querySelectorAll(".tab-btn").forEach(function(b){
      b.setAttribute("aria-selected", String(b===tab));
    });
    body.querySelectorAll(".tab-panel").forEach(function(p){
      p.classList.toggle("active", p.getAttribute("data-panel")===which);
    });
    return;
  }
  var btn=e.target.closest(".copy-btn");
  if(!btn) return;
  e.preventDefault();
  e.stopPropagation();
  var kind=btn.getAttribute("data-kind");
  if(kind==="all"){
    var name=btn.getAttribute("data-drug");
    var d=byName[name];
    if(d) writeText(drugPlain(d), btn);
    return;
  }
  var box=btn.closest(".section");
  var p=box && box.querySelector(".section-text");
  writeText(p ? p.textContent : "", btn);
});

document.getElementById("copySel").onclick=function(){
  var sel=String(window.getSelection ? window.getSelection() : "");
  if(!sel.trim()){ toast("حدّد نصاً أولاً"); return; }
  writeText(sel, null);
};
q.addEventListener("input", render);
document.getElementById("expandAll").onclick=function(){ list.querySelectorAll("details").forEach(function(d){ d.open=true; }); };
document.getElementById("collapseAll").onclick=function(){ list.querySelectorAll("details").forEach(function(d){ d.open=false; }); };
document.getElementById("themeBtn").onclick=function(){
  var dark=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme", dark?"light":"dark");
};
document.getElementById("menuBtn").onclick=function(){
  side.classList.add("open");
  backdrop.hidden=false;
  backdrop.classList.add("show");
  document.body.style.overflow="hidden";
};
backdrop.addEventListener("click", closeMenu);
window.addEventListener("resize", function(){
  if(window.matchMedia("(min-width:1100px)").matches) closeMenu();
});
mkNav(); render();
</script>
</body>
</html>
