<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08353C">
<title>د. منوّرة محمد جواد — مرجع أدوية التخدير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3FAFB; --ink:#102830;
  --muted:#5A737B; --line:rgba(16,40,48,.12); --accent:#0E7F88;
  --accent-2:#C4A574; --surface:#FFFFFF; --soft:#E5F3F4;
  --side:#0A2B32; --side-ink:#D7EBEE; --side-muted:#8BB0B7;
  --panel:rgba(255,255,255,.72); --section:#F7FCFC; --section-2:#F1F8F9;
  --chapter-bg:linear-gradient(180deg, rgba(243,250,251,.96), rgba(243,250,251,.88));
  --page-bg:radial-gradient(900px 420px at 90% -10%, rgba(196,165,116,.18), transparent 55%),
    radial-gradient(700px 500px at -10% 20%, rgba(14,127,136,.14), transparent 50%),
    linear-gradient(180deg, #EAF5F6 0%, var(--paper) 28%, #EEF6F7 100%);
  --ok:#0B7A5A; --top:68px; --r:18px;
  --pad-x:24px; --pad-y:22px; --gap:14px; --fs:16.5px;
  --hero-h1:clamp(1.85rem, 1.2rem + 2.2vw, 3.05rem);
  --brand-fs:clamp(1.05rem, 0.95rem + 0.6vw, 1.4rem);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
html[data-theme="dark"]{
  --paper:#0B1C21; --ink:#E7F3F5;
  --muted:#9BB4BB; --line:rgba(231,243,245,.12); --accent:#4DBDC8;
  --accent-2:#D2B484; --surface:#12262C; --soft:#16343A;
  --side:#07171C; --side-ink:#D7EBEE; --side-muted:#7FA4AC;
  --panel:rgba(18,38,44,.82); --section:#153038; --section-2:#12282E;
  --chapter-bg:linear-gradient(180deg, rgba(11,28,33,.96), rgba(11,28,33,.88));
  --page-bg:radial-gradient(800px 380px at 90% -10%, rgba(196,165,116,.12), transparent 55%),
    linear-gradient(180deg, #07161B 0%, #0B1C21 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{
  scroll-behavior:smooth; scroll-padding-top:calc(var(--top) + 16px);
  overflow-x:clip; -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
body{
  margin:0; color:var(--ink); font-family:"Tajawal",sans-serif; font-size:var(--fs); line-height:1.65;
  background:var(--page-bg);
  min-height:100vh; max-width:100%; overflow-x:clip;
  -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.35; z-index:0;
  background-image:linear-gradient(rgba(14,127,136,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(14,127,136,.05) 1px, transparent 1px);
  background-size:28px 28px; mask-image:radial-gradient(ellipse at center, #000 30%, transparent 78%);
}
::selection{background:rgba(14,127,136,.28)}
button,input{font:inherit; touch-action:manipulation}
.wrap{position:relative; z-index:1; max-width:1320px; margin:0 auto; width:100%}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:clamp(8px, 2vw, 12px);
  min-height:var(--top);
  padding:calc(8px + var(--safe-t)) max(12px,var(--safe-r)) 8px max(12px,var(--safe-l));
  background:rgba(7,30,36,.82); color:#EAF6F7;
  backdrop-filter:blur(16px) saturate(1.2);
  border-bottom:1px solid rgba(255,255,255,.08);
  width:100%;
}
.topbar .mark{
  width:clamp(34px, 9vw, 42px); height:clamp(34px, 9vw, 42px); border-radius:12px; flex:none;
  display:grid; place-items:center; font-family:"Amiri",serif; font-weight:700; font-size:clamp(1rem, 2.8vw, 1.2rem);
  background:linear-gradient(145deg, var(--accent-2), #9A7A4A); color:#1A1208;
  box-shadow:0 8px 20px rgba(196,165,116,.25);
}
.brand{flex:1; min-width:0}
.brand strong{display:block; font-family:"Amiri",serif; font-size:var(--brand-fs); font-weight:700; line-height:1.2}
.brand span{display:block; font-size:clamp(.68rem, 2.2vw, .78rem); opacity:.72; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.icon{
  width:clamp(38px, 10vw, 44px); height:clamp(38px, 10vw, 44px); border-radius:12px; border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06); color:#EAF6F7; cursor:pointer; display:grid; place-items:center; flex:none;
}
.icon:active{transform:scale(.96)}

.shell{display:grid; grid-template-columns:290px minmax(0,1fr); gap:0; min-height:calc(100vh - var(--top))}
.side{
  background:linear-gradient(180deg, var(--side) 0%, #071F25 100%);
  color:var(--side-ink); padding:22px 14px calc(28px + var(--safe-b));
  position:sticky; top:var(--top); height:calc(100vh - var(--top)); overflow:auto;
  border-inline-end:1px solid rgba(255,255,255,.06);
}
.side-title{font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--side-muted); margin:0 10px 12px; font-weight:700}
.nav{display:flex; flex-direction:column; gap:6px}
.nav button{
  text-align:start; border:0; cursor:pointer; color:inherit; background:transparent;
  border-radius:14px; padding:12px 14px; transition:background .2s, transform .2s;
}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-pressed="true"]{
  background:linear-gradient(90deg, rgba(196,165,116,.22), rgba(14,127,136,.35));
  box-shadow:inset 3px 0 0 var(--accent-2);
}
.nav .t{display:block; font-weight:700; font-size:.95rem}
.nav .s{display:block; font-size:.75rem; color:var(--side-muted); margin-top:3px}

.main{padding:var(--pad-y) var(--pad-x) calc(48px + var(--safe-b)); min-width:0; width:100%}
.hero{
  position:relative; overflow:hidden; border-radius:clamp(16px, 4vw, 28px); margin-bottom:clamp(12px, 2.5vw, 18px);
  padding:clamp(14px, 3.5vw, 36px);
  color:#F4FBFC;
  background:
    radial-gradient(500px 220px at 85% 0%, rgba(196,165,116,.35), transparent 60%),
    linear-gradient(135deg, #08353C 0%, #0E5B63 48%, #0A444C 100%);
  box-shadow:0 24px 50px rgba(8,53,60,.22);
  animation:rise .7s ease both;
}
.hero::after{
  content:""; position:absolute; inset:auto -10% -40% auto; width:min(280px, 55vw); height:min(280px, 55vw); border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.12), transparent 70%); pointer-events:none;
}
.hero-kicker{margin:0 0 8px; color:var(--accent-2); font-weight:700; font-size:clamp(.72rem, 2.2vw, .85rem); letter-spacing:.04em}
.hero h1{
  margin:0; font-family:"Amiri",serif; font-weight:700;
  font-size:var(--hero-h1); line-height:1.3; max-width:100%;
  overflow-wrap:anywhere; word-break:break-word;
}
.hero p{margin:10px 0 0; max-width:42ch; opacity:.86; font-size:clamp(.9rem, 2.5vw, 1.02rem)}
.hero-stats{display:flex; flex-wrap:wrap; gap:8px; margin-top:clamp(12px, 3vw, 18px)}
.hero-stats span{
  display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.12); font-size:clamp(.72rem, 2.2vw, .84rem);
}

.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:clamp(14px, 3vw, 22px);
  padding:clamp(10px, 2.5vw, 14px); backdrop-filter:blur(8px); margin-bottom:14px;
  box-shadow:0 10px 30px rgba(16,40,48,.04); animation:rise .75s .05s ease both;
}
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; -webkit-overflow-scrolling:touch; scrollbar-width:thin}
.chip{
  flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:9px 14px; cursor:pointer; font-size:.86rem; font-weight:700;
}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.toolbar{display:grid; gap:10px}
.search{
  display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; padding:4px 4px 4px 14px;
}
.search svg{flex:none; opacity:.55}
.search input{
  flex:1; border:0; outline:0; background:transparent; padding:12px 8px;
  font-size:16px; min-width:0; /* 16px يمنع زوم iOS */
  color:var(--ink); -webkit-user-select:text; user-select:text;
}
.tools{display:flex; flex-wrap:wrap; gap:8px}
.tools button{
  min-height:40px; padding:8px 12px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); cursor:pointer; font-weight:700; font-size:clamp(.8rem, 2.3vw, .88rem); color:var(--ink);
}
.tools button:hover{border-color:var(--accent); color:var(--accent)}
.count{margin:10px 4px 14px; color:var(--muted); font-size:.9rem; font-weight:500}

.chapter{margin:0 0 28px; animation:rise .5s ease both}
.chapter-head{
  display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:8px;
  margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line);
  position:sticky; top:calc(var(--top) + 4px); z-index:5;
  background:var(--chapter-bg);
  backdrop-filter:blur(8px);
}
.chapter-head h2{margin:0; font-size:clamp(1rem, 2.8vw, 1.15rem); font-weight:800; min-width:0; overflow-wrap:anywhere}
.chapter-head .meta{color:var(--muted); font-size:clamp(.72rem, 2.1vw, .82rem)}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  gap:var(--gap);
  width:100%;
}

details.drug{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; min-width:0; width:100%;
  transition:box-shadow .25s, border-color .25s;
}
details.drug[open]{border-color:rgba(14,127,136,.35); box-shadow:0 16px 36px rgba(8,53,60,.08)}
summary{
  list-style:none; cursor:pointer; padding:clamp(12px, 2.8vw, 16px);
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:clamp(8px, 2vw, 12px); align-items:center;
  -webkit-user-select:text; user-select:text;
}
summary::-webkit-details-marker{display:none}
.dot{
  width:8px; height:8px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 0 5px rgba(14,127,136,.12); flex:none;
}
.nm{
  font-family:"Literata",Georgia,serif; font-weight:700; font-size:clamp(.98rem, 2.6vw, 1.12rem); line-height:1.3;
  direction:ltr; unicode-bidi:isolate; text-align:left; min-width:0; overflow-wrap:anywhere;
}
.ch{font-size:clamp(.68rem, 2vw, .75rem); font-weight:700; color:var(--accent); background:var(--soft); padding:3px 8px; border-radius:999px; white-space:nowrap}
.body{padding:0 clamp(10px, 2.5vw, 14px) clamp(12px, 3vw, 16px); border-top:1px solid var(--line)}
.actions{display:flex; justify-content:flex-end; padding:12px 0 4px}
.section{
  margin-top:10px; padding:clamp(10px, 2.4vw, 12px); border-radius:12px;
  background:linear-gradient(180deg, var(--section), var(--section-2));
  border:1px solid rgba(14,127,136,.1);
  min-width:0;
}
.section-head{display:flex; align-items:center; gap:8px; margin-bottom:6px; direction:rtl; min-width:0}
.section-head h3{margin:0; flex:1; min-width:0; font-size:clamp(.8rem, 2.3vw, .9rem); font-weight:800; color:var(--accent); overflow-wrap:anywhere}
.copy-btn{
  flex:none; min-height:34px; padding:5px 10px; border-radius:10px; cursor:pointer;
  border:1px solid rgba(14,127,136,.2); background:var(--surface); color:var(--accent);
  font-size:clamp(.72rem, 2vw, .8rem); font-weight:800;
}
.copy-btn.ok{background:#E8F7F0; border-color:var(--ok); color:var(--ok)}
.section-text{
  margin:0; font-size:clamp(.88rem, 2.4vw, .98rem); white-space:pre-wrap; overflow-wrap:anywhere;
  direction:ltr; unicode-bidi:isolate; text-align:left;
  -webkit-user-select:text; user-select:text;
}
.meta-en,.hero-kicker{direction:ltr; unicode-bidi:isolate; text-align:left}
.ref{margin:12px 2px 0; color:var(--muted); font-size:.8rem; direction:rtl}
.empty{text-align:center; padding:40px 10px; color:var(--muted)}
.foot{margin-top:28px; color:var(--muted); font-size:.9rem; text-align:center}
.foot strong{color:var(--ink); font-family:"Amiri",serif; font-size:1.05rem}

.backdrop{display:none; position:fixed; inset:0; background:rgba(4,18,22,.5); z-index:50}
.backdrop.show{display:block}
.toast{
  position:fixed; left:50%; bottom:calc(20px + var(--safe-b)); transform:translateX(-50%) translateY(140%);
  background:#08353C; color:#F3FAFB; padding:12px 18px; border-radius:999px; font-weight:700;
  z-index:60; opacity:0; transition:.28s ease; pointer-events:none; box-shadow:0 12px 30px rgba(0,0,0,.25);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@keyframes rise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}

/* هاتف عام */
@media (max-width:767px){
  :root{
    --fs:15px; --top:58px; --pad-x:14px; --pad-y:14px; --gap:10px;
    --hero-h1:clamp(1.45rem, 1.1rem + 3.2vw, 1.85rem);
    --brand-fs:clamp(1rem, 0.9rem + 1.4vw, 1.2rem);
  }
  .shell{grid-template-columns:1fr}
  .side{
    position:fixed; top:0; bottom:0; inset-inline-start:0; width:min(86vw,300px); height:100%;
    z-index:55; transform:translateX(110%); transition:transform .24s ease;
    padding:calc(16px + var(--safe-t)) 12px calc(24px + var(--safe-b));
  }
  html[dir="rtl"] .side{transform:translateX(-110%)}
  .side.open{transform:translateX(0)!important}
  .grid{grid-template-columns:1fr}
  .menu-only{display:grid}
  .chapter-head{top:calc(var(--top) + 2px)}
  .toast{max-width:calc(100vw - 24px); white-space:normal; text-align:center; font-size:.85rem}
}

/* هاتف صغير — بعد العام حتى لا يُلغى */
@media (max-width:480px){
  :root{
    --fs:14.5px; --top:56px; --r:14px; --pad-x:12px; --pad-y:12px; --gap:10px;
    --hero-h1:clamp(1.35rem, 1.05rem + 3.8vw, 1.7rem);
    --brand-fs:clamp(.95rem, 0.85rem + 1.8vw, 1.15rem);
  }
  .topbar .mark{display:none}
  .hero-stats span{padding:5px 9px}
  .tools button{flex:1 1 calc(50% - 8px); min-width:0}
  .chip{padding:7px 11px; font-size:.8rem}
}

/* آيباد / تابلت */
@media (min-width:768px) and (max-width:1024px){
  :root{
    --fs:15.5px; --top:62px; --pad-x:18px; --pad-y:18px; --gap:12px;
    --hero-h1:clamp(1.7rem, 1.2rem + 1.8vw, 2.25rem);
    --brand-fs:clamp(1.05rem, 0.95rem + 0.8vw, 1.28rem);
  }
  .shell{grid-template-columns:1fr}
  .side{
    position:fixed; top:0; bottom:0; inset-inline-start:0; width:min(70vw,320px); height:100%;
    z-index:55; transform:translateX(110%); transition:transform .24s ease;
    padding:calc(16px + var(--safe-t)) 14px calc(24px + var(--safe-b));
  }
  html[dir="rtl"] .side{transform:translateX(-110%)}
  .side.open{transform:translateX(0)!important}
  .grid{grid-template-columns:repeat(2, minmax(0,1fr))}
  .menu-only{display:grid}
}

/* سطح مكتب */
@media (min-width:1025px){
  .menu-only{display:none}
  .chips{display:none}
}
</style>
</head>
<body>
<div class="backdrop" id="backdrop" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<header class="topbar">
  <button type="button" class="icon menu-only" id="menuBtn" aria-label="الفصول">☰</button>
  <div class="mark" aria-hidden="true">م</div>
  <div class="brand">
    <strong>الدكتورة منوّرة محمد جواد</strong>
    <span>مرجع أدوية التخدير والعناية الحرجة</span>
  </div>
  <button type="button" class="icon" id="themeBtn" aria-label="مظهر" title="مظهر">◐</button>
</header>

<div class="wrap">
<div class="shell">
  <aside class="side" id="side" aria-label="الفصول">
    <p class="side-title">الفصول</p>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <section class="hero">
      <p class="hero-kicker" dir="ltr" lang="en">Anesthesia Drug Desk</p>
      <h1>الدكتورة منوّرة محمد جواد</h1>
      <p>مرجع منظم لأدوية التخدير.</p>
      <div class="hero-stats">
        <span id="statDrugs">— دواء</span>
        <span>10 فصول</span>
        <span>نسخ بنقرة واحدة</span>
      </div>
    </section>

    <div class="panel">
      <div class="chips" id="chips"></div>
      <div class="toolbar">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="q" placeholder="ابحث عن دواء، آلية، أو تأثير…" aria-label="بحث" autocomplete="off">
        </label>
        <div class="tools">
          <button type="button" id="expandAll">توسيع الكل</button>
          <button type="button" id="collapseAll">طي الكل</button>
          <button type="button" id="copySel">نسخ التحديد</button>
        </div>
      </div>
    </div>

    <p class="count" id="count" aria-live="polite"></p>
    <div id="list"></div>
    <p class="foot"><strong>د. منوّرة محمد جواد</strong><br>مرجع أدوية التخدير</p>
  </main>
</div>
</div>

var D=[
["Nitrous oxide",8,"19–22","Gas at room temperature; NMDA receptor antagonist like xenon. Nonflammable but supports combustion.","Adjunct to potent volatile agents (65% lowers their MAC by about 50%). Analgesia below MAC in dental work, labor, trauma and minor procedures.","Expands closed air spaces. Limited use when high inspired oxygen is needed. Raises postoperative nausea and vomiting in adults. Usually avoided before the third trimester.",[["Cardiovascular","Sympathetic stimulation keeps blood pressure, cardiac output and heart rate roughly unchanged despite direct myocardial depression, which can be unmasked in coronary disease or severe hypovolemia. Pulmonary vascular resistance rises modestly."],["Respiratory","Faster, shallower breathing with little change in minute ventilation. Markedly depresses the hypoxic drive even at small concentrations."],["CNS and other organs","Raises cerebral blood flow, blood volume and oxygen consumption, so ICP rises mildly. No meaningful muscle relaxation. Does not trigger malignant hyperthermia. Lowers renal blood flow and urine output; hepatic flow falls less than with volatile agents."],["Toxicity","Oxidizes the cobalt of vitamin B12, inhibiting methionine synthetase (myelin) and thymidylate synthetase (DNA). Prolonged exposure can cause megaloblastic anemia and neuropathy. May impair neutrophil function. Ozone-depleting greenhouse gas."],["Contraindications","About 35 times more soluble than nitrogen, so it enters closed gas spaces faster than nitrogen leaves: pneumothorax, bowel obstruction, air embolism, pneumocephalus, pulmonary air cysts, intraocular gas, middle-ear grafts. It also diffuses into endotracheal cuffs."],["Interactions","Changing the nitrous oxide fraction changes the volatile concentration delivered at a fixed vaporizer setting. It attenuates the circulatory and respiratory effects of volatile agents in adults."]]],
["Halothane",8,"22–26","Halogenated alkane, nonflammable. Potent bronchodilator.","Historically used for inhalation induction, especially in children.","Dose-dependent myocardial depression. Sensitizes the heart to epinephrine (avoid above 1.5 mcg/kg). Rare immune-mediated hepatitis.",[["Cardiovascular","At 2 MAC in non-surgical patients, blood pressure and cardiac output fell by 50%. Blunts the baroreflex; may cause junctional rhythm or bradycardia. In infants it lowers cardiac output through lower heart rate and contractility."],["Respiratory","Rapid shallow breathing, lower alveolar ventilation, higher PaCO2 and apneic threshold. Hypoxic drive is severely depressed even at 0.1 MAC. Bronchodilation is not blocked by β-blockers. Reduces mucociliary clearance."],["CNS","Dilates cerebral vessels, raising blood flow and volume, and blunts autoregulation. Establish hyperventilation before giving it to prevent ICP rise."],["Other organs","Relaxes muscle and potentiates nondepolarizing blockers. Triggers malignant hyperthermia. Lowers renal blood flow, GFR and urine output (preoperative hydration limits this). Hepatic blood flow falls with cardiac output; clearance of fentanyl, phenytoin and verapamil may be impaired."],["Metabolism and toxicity","Oxidized by CYP2E1 to trifluoroacetic acid. Reductive metabolism under low oxygen, especially after enzyme induction by barbiturates, produces hepatotoxic products. Risk factors for hepatitis: repeated exposures at short intervals, middle-aged obese women, personal or family history. Features include eosinophilia, rash and fever, with an immune response against trifluoroacetylated liver proteins."],["Contraindications","Unexplained liver dysfunction after a prior exposure; intracranial mass lesions (only with modest hyperventilation); hypovolemia or severe left ventricular dysfunction; pheochromocytoma or use of exogenous epinephrine."],["Interactions","Myocardial depression worsens with β-blockers and calcium channel blockers. Blood pressure swings and arrhythmias with tricyclics and MAO inhibitors (not absolute contraindications). Ventricular arrhythmias with aminophylline."]]],
["Isoflurane",8,"26–27","Nonflammable volatile agent with a pungent ethereal odor.","Maintenance of anesthesia.","Rapid concentration rises transiently increase heart rate, blood pressure and norepinephrine. Vasodilation is poorly tolerated in severe hypovolemia. Triggers malignant hyperthermia.",[["Cardiovascular","Minimal left ventricular depression. Cardiac output is kept up by a higher heart rate (partly preserved baroreflex), while vascular resistance and pressure fall. Mild coronary dilation; the old coronary steal concern has largely been forgotten."],["Respiratory","Less tachypnea than other volatiles, so minute ventilation falls more. Blunts hypoxic and hypercapnic responses at 0.1 MAC. Irritates the airway yet bronchodilates, slightly less than halothane."],["CNS","Above 1 MAC raises CBF and ICP, less than halothane, and hyperventilation need not be started beforehand. Lowers cerebral oxygen use; isoelectric EEG at 2 MAC."],["Other organs","Relaxes muscle. Lowers renal blood flow, GFR and urine output. Hepatic artery perfusion is preserved and liver tests are usually unaffected."],["Metabolism and toxicity","Metabolized to trifluoroacetic acid. Fluoride may rise, even with prolonged ICU sedation, but nephrotoxicity is extremely unlikely. Little oxidative metabolism limits hepatic risk."],["Interactions","Epinephrine can be given up to 4.5 mcg/kg. Potentiates nondepolarizing blockers."]]],
["Desflurane",8,"27–30","Isoflurane with fluorine in place of chlorine. Vapor pressure 681 mm Hg at 20°C, so it needs a special vaporizer. Blood/gas coefficient 0.42, lower than nitrous oxide. About one-fourth as potent as other volatiles.","Maintenance with tight control; wake-up about 50% faster than isoflurane.","Pungent, so a poor choice for inhalation induction. Rapid increases cause sympathetic surges. Desiccated absorbent can generate carbon monoxide. Triggers malignant hyperthermia.",[["Cardiovascular","Like isoflurane: vascular resistance and pressure fall, cardiac output little changed at 1–2 MAC, moderate rise in heart rate, CVP and PA pressure. Rapid increases cause transient tachycardia, hypertension and catecholamine rise, more than isoflurane, attenuated by fentanyl, esmolol or clonidine."],["Respiratory","Lower tidal volume, higher rate, lower alveolar ventilation, higher PaCO2. Induction can cause salivation, breath-holding, cough and laryngospasm; airway resistance may rise in children with reactive airways."],["CNS","Vasodilates cerebral vessels but cerebral oxygen use falls, so flow stays adequate at a mean pressure of 60 mm Hg. ICP can be lowered by hyperventilation. EEG shows burst suppression at high concentration."],["Other organs","Dose-dependent decrease in train-of-four response. No significant nephrotoxicity or hepatic effect."],["Metabolism and toxicity","Minimal metabolism; fluoride unchanged. Degraded by desiccated CO2 absorbent, especially barium hydroxide lime, into carbon monoxide. Suspect it with carboxyhemoglobin or unexpectedly low pulse oximetry. Discard dried absorbent. Most ozone-depleting volatile."],["Contraindications","Severe hypovolemia, malignant hyperthermia, intracranial hypertension."],["Interactions","Potentiates nondepolarizing blockers like isoflurane. Epinephrine up to 4.5 mcg/kg. Switching from isoflurane late in the case does not speed recovery or PACU discharge. Emergence delirium in some children."]]],
["Sevoflurane",8,"30–32","Fluorinated ether; blood/gas coefficient 0.65. Nonpungent. Modest vapor pressure allows a conventional vaporizer.","Smooth, rapid inhalation induction in children and adults (4–8% in nitrous oxide/oxygen within about 1 minute). Faster emergence than isoflurane, though not earlier PACU discharge.","Compound A with some CO2 absorbents, fluoride release, rare hydrogen fluoride. Triggers malignant hyperthermia.",[["Cardiovascular","Mild myocardial depression. Vascular resistance and pressure fall slightly less than with isoflurane or desflurane, but little heart rate rise means cardiac output is less well maintained. May prolong QT (in infants up to 60 min after emergence)."],["Respiratory","Depresses respiration and reverses bronchospasm similarly to isoflurane."],["CNS","Slight rise in CBF and ICP at normocarbia. Above 1.5 MAC may impair autoregulation, less than isoflurane. No seizure activity reported."],["Other organs","Relaxation is adequate for intubation after inhalation induction, though most clinicians deepen anesthesia or add a blocker. Slightly lowers renal blood flow. Hepatic artery flow rises as portal flow falls, keeping total flow; not linked to immune hepatotoxicity."],["Metabolism and toxicity","About 5% is metabolized (CYP2E1, inducible by ethanol and phenobarbital). Fluoride exceeds 50 μmol/L in about 7% of patients without clinically significant kidney dysfunction. Compound A forms with barium hydroxide lime or soda lime (not calcium hydroxide), more with low flows, heat, dry absorbent and long cases; no known human harm, though some advise fresh gas flow of at least 2 L/min in cases lasting several hours. Hydrogen fluoride from impurities is minimized by added water and plastic packaging. Rare circuit fires with desiccated absorbent."],["Contraindications","Severe hypovolemia, susceptibility to malignant hyperthermia, intracranial hypertension."],["Interactions","Potentiates nondepolarizing blockers. Does not sensitize the heart to catecholamine arrhythmias."]]],
["Xenon",8,"33","Inert noble gas. NMDA inhibition by competing at the glycine site. MAC about 71%, blood/gas coefficient 0.115.","Rarely used: very fast onset and emergence, minimal cardiovascular, hepatic and renal effects. A small trial found less postoperative delirium than sevoflurane in off-pump coronary surgery.","High cost, scarcity and low potency limit use. Does not trigger malignant hyperthermia and does not harm the ozone layer. May be neuroprotective.",[]],

["Thiopental",9,"37–41","Barbiturate enhancing GABA-A activity; highly lipid soluble; redistributes quickly after a single dose.","Induction; brief control of seizures; historically used for burst-suppression / brain protection infusions.","Lowers cerebral metabolism, blood flow and ICP. No analgesia. Hypotension. Avoid in acute intermittent porphyria. Context-sensitive half-time rises with prolonged infusion."],
["Methohexital",9,"37–41","Oxybarbiturate with a methyl group; GABA-A potentiator. Shorter acting than thiopental after a single dose.","Induction; preferred barbiturate when a seizure is the goal (ECT) because it is less anticonvulsant than phenobarbital-class agents.","Involuntary muscle movements, hiccups, pain on injection. Same porphyria caution as other barbiturates."],
["Propofol",9,"53–55","Enhances GABA-A activity; 1% lipid emulsion.","Induction, TIVA, sedation; antiemetic and anticonvulsant.","Hypotension via lower vascular resistance and impaired baroreflex. Profound respiratory depression. Pain on injection. Strict asepsis, use within 6 h. Propofol infusion syndrome with prolonged infusion."],
["Etomidate",9,"50–52","GABA-A modulator dissolved in propylene glycol.","Induction with hemodynamic stability; useful when cardiac reserve is limited.","Adrenocortical suppression (11-β-hydroxylase), myoclonus, nausea and vomiting, pain on injection. Light anesthetic depth for laryngoscopy unless supplemented."],
["Ketamine",9,"","NMDA antagonist producing dissociative anesthesia; also used as an analgesic adjunct and antidepressant.","Induction, analgesia, unstable or hypovolemic patients; IM option when IV access is delayed.","Raises heart rate, blood pressure and ICP (context-dependent). Emergence reactions. Hypersalivation—often paired with an anticholinergic."],
["Midazolam",9,"","Water-soluble benzodiazepine enhancing GABA-A; short clinical duration after bolus via redistribution.","Premedication, sedation, amnesia, seizures; co-induction.","Respiratory depression, additive with opioids. Reversible with flumazenil."],
["Diazepam",9,"","Lipophilic benzodiazepine; active metabolites prolong effect.","Anxiolysis, seizures, muscle spasm; less common for induction than midazolam.","Prolonged sedation, especially in elderly or hepatic impairment. Painful IM/IV injection (propylene glycol formulations)."],
["Lorazepam",9,"","Benzodiazepine with reliable anticonvulsant effect and no active metabolites of clinical importance.","Sedation, status epilepticus, ICU anxiolysis.","Slower onset IV than midazolam; prolonged sedation. Respiratory depression with co-administration of opioids."],
["Dexmedetomidine",9,"55–57","Selective α2-agonist.","Anxiolysis, sedation, analgesia; opioid-sparing adjunct; not a complete anesthetic alone.","Bradycardia and hypotension. Little respiratory depression compared with GABA agonists."],

["Morphine",10,"","μ-opioid agonist; histamine release possible.","Analgesia; longer postoperative coverage than fentanyl.","Histamine release and hypotension. Active metabolite (M6G) accumulates in renal failure. Respiratory depression, nausea, pruritus."],
["Meperidine",10,"68–72","Opioid with local anesthetic and anticholinergic properties.","Analgesia; treatment of shivering.","Normeperidine accumulates and can cause seizures. Serotonin syndrome with MAO inhibitors. Avoid chronic use in renal failure."],
["Fentanyl",10,"66–68","Potent μ agonist; highly lipid soluble.","Analgesia; blunts the intubation response; component of balanced anesthesia.","Respiratory depression, bradycardia. Chest wall rigidity with large rapid doses."],
["Sufentanil",10,"","Very potent μ agonist; more lipid soluble than fentanyl.","Major cases needing intense analgesia with relatively stable hemodynamics.","Profound respiratory depression; delayed recovery after large total doses."],
["Alfentanil",10,"","Shorter-acting μ agonist with rapid onset due to low pKa (more non-ionized).","Brief intense stimuli; infusion for shorter procedures.","Muscle rigidity, bradycardia, respiratory depression."],
["Remifentanil",10,"68–69","Opioid broken down by nonspecific esterases, so offset is ultrashort and context-insensitive.","Infusion with rapid recovery; neurosurgery and TIVA.","Plan postoperative analgesia in advance. Bradycardia, hypotension, rigidity. Acute opioid tolerance / hyperalgesia possible."],
["Hydromorphone",10,"","μ agonist more potent than morphine with less histamine release.","Perioperative and PCA analgesia.","Respiratory depression; accumulate caution in organ failure."],
["Naloxone",10,"63","Competitive opioid antagonist.","Reversal of opioid respiratory depression.","Shorter action than many opioids, so effects can return. Can cause pain, hypertension, arrhythmia, pulmonary edema."],

["Succinylcholine",11,"","Depolarizing blocker; fastest onset, short duration (plasma cholinesterase).","Rapid-sequence intubation.","Hyperkalemia (burns, crush, denervation, myopathies). Malignant hyperthermia, masseter spasm, bradycardia. Prolonged block with abnormal cholinesterase."],
["Rocuronium",11,"","Nondepolarizing aminosteroid; rapid onset at higher intubating doses.","Intubation and relaxation; alternative for rapid sequence.","Anaphylaxis is possible. Reversed by sugammadex or neostigmine (depth-dependent)."],
["Vecuronium",11,"","Intermediate-acting aminosteroid; minimal cardiovascular effect.","Muscle relaxation for intermediate procedures.","Can be prolonged in renal or hepatic failure and with long infusions."],
["Pancuronium",11,"","Long-acting aminosteroid; vagolytic.","Long cases needing lasting relaxation (less common now).","Tachycardia and hypertension; prolonged effect in renal failure."],
["Atracurium",11,"","Benzylisoquinolinium cleared by Hofmann elimination and ester hydrolysis.","Relaxation when organ-independent clearance is desirable.","Histamine release with rapid large doses → flushing, hypotension, bronchospasm."],
["Cisatracurium",11,"","Benzylisoquinolinium isomer cleared mainly by Hofmann elimination.","Relaxation, including ICU infusions and organ failure.","Little histamine release; organ-independent elimination."],
["Mivacurium",11,"","Short-acting benzylisoquinolinium hydrolyzed by plasma cholinesterase.","Short procedures when rapid spontaneous recovery is wanted.","Histamine release; prolonged block with cholinesterase deficiency."],

["Neostigmine",12,"124–132","Cholinesterase inhibitor that increases acetylcholine at the neuromuscular junction.","Reversal of nondepolarizing block once recovery has begun.","Give with an anticholinergic to blunt bradycardia and secretions. Ineffective for deep block."],
["Edrophonium",12,"","Short-acting cholinesterase inhibitor.","Historically used for rapid reversal of shallow residual block; also diagnostic testing.","Brief action; muscarinic effects—pair with atropine. Not for deep block."],
["Pyridostigmine",12,"","Longer-acting cholinesterase inhibitor.","Reversal option; more often chronic myasthenia therapy than OR use.","Muscarinic side effects; slower onset than edrophonium."],
["Sugammadex",12,"129–133","Modified γ-cyclodextrin that encapsulates rocuronium and vecuronium.","Reversal of even deep aminosteroid block.","Anaphylaxis, bradycardia. May reduce hormonal contraceptive efficacy. Limited effect on benzylisoquinoliniums."],

["Atropine",13,"134–140","Tertiary antimuscarinic; crosses the blood–brain barrier.","Bradycardia, antisialagogue, paired with cholinesterase inhibitors.","Tachycardia, dry mouth, mydriasis, central anticholinergic syndrome."],
["Glycopyrrolate",13,"139–140","Quaternary antimuscarinic; does not enter the CNS.","Antisialagogue; paired with neostigmine.","Less tachycardia than atropine; no central effects."],
["Scopolamine",13,"","Tertiary antimuscarinic with strong central and antiemetic effects.","Premedication, PONV prophylaxis (patch), antisialagogue.","Sedation, amnesia, delirium risk in elderly; mydriasis, dry mouth."],

["Epinephrine",14,"","α and β agonist.","Anaphylaxis, cardiac arrest, bronchospasm, shock; additive in local anesthetics.","Arrhythmias, hypertension, ischemia. Tissue necrosis if extravasated."],
["Norepinephrine",14,"","α1 and β1 agonist.","Vasodilatory / septic shock.","Reflex bradycardia; reduced organ perfusion if excessive. Extravasation injury."],
["Dopamine",14,"","Dose-dependent dopaminergic, β, then α agonist.","Shock with need for inotropy and vasoconstriction (role has narrowed vs norepinephrine).","Tachycardia, arrhythmias; variable receptor effects by dose and infusion duration."],
["Phenylephrine",14,"151–152","Pure α1 agonist.","Hypotension after induction or neuraxial block.","Reflex bradycardia and reduced cardiac output."],
["Ephedrine",14,"154","Direct and indirect sympathomimetic (norepinephrine release).","Anesthesia-induced hypotension, especially when heart rate is low.","Tachyphylaxis with repeated doses; tachycardia; caution with MAO inhibitors."],
["Dobutamine",14,"155","β1-predominant inotrope with some β2 / α effects.","Low cardiac output, heart failure, stress testing.","Tachycardia, arrhythmias; may lower vascular resistance."],
["Isoproterenol",14,"","Nonselective β agonist.","Bradycardia / heart block when pacing is unavailable; pulmonary hypertension contexts historically.","Tachycardia, arrhythmias, vasodilation and hypotension."],
["Esmolol",14,"158–159","Ultrashort-acting β1-selective blocker cleared by esterases.","Blunting intubation response, rate control.","Bradycardia, hypotension; caution in heart block and asthma."],
["Labetalol",14,"","Combined α1 and nonselective β blocker.","Perioperative hypertension.","Bradycardia, bronchospasm risk; avoid in decompensated heart failure."],
["Clonidine",14,"","Central α2 agonist.","Premedication, opioid sparing, blunting of sympathetic responses; adjuvant in regional anesthesia.","Sedation, bradycardia, hypotension; rebound hypertension if stopped abruptly."],
["Phentolamine",14,"","Competitive nonselective α blocker.","Pheochromocytoma; local treatment of catecholamine extravasation.","Reflex tachycardia, hypotension."],

["Nitroprusside",15,"165–172","Arterial and venous vasodilator via nitric oxide.","Hypertensive crisis, controlled hypotension.","Cyanide / thiocyanate toxicity, reflex tachycardia, rebound hypertension, raised ICP."],
["Nitroglycerin",15,"171–172","Nitric oxide donor, mainly venodilator at lower doses.","Myocardial ischemia, preload reduction, controlled hypotension.","Headache, hypotension, tolerance with continuous infusion."],
["Hydralazine",15,"","Direct arteriolar vasodilator.","Perioperative hypertension, especially when afterload reduction is desired.","Reflex tachycardia, lupus-like syndrome with chronic oral use."],
["Nicardipine",15,"174","Dihydropyridine calcium channel blocker.","Perioperative hypertension by infusion.","Reflex tachycardia, headache."],
["Clevidipine",15,"","Ultrashort dihydropyridine in lipid emulsion; esterase clearance.","Titratable arterial pressure control.","Reflex tachycardia; lipid load with long infusions; allergy to soy/egg components."],

["Lidocaine",16,"","Amide local anesthetic; sodium channel blocker.","Infiltration, blocks, epidural, topical; IV for arrhythmias and intubation response.","Local anesthetic systemic toxicity with overdose or intravascular injection."],
["Bupivacaine",16,"","Long-acting amide, highly protein bound.","Spinal, epidural, peripheral nerve blocks.","Marked cardiotoxicity with intravascular injection; treat toxicity with lipid emulsion."],
["Ropivacaine",16,"194","Amide related to bupivacaine; S-enantiomer.","Epidural and peripheral blocks.","Less cardiotoxic and motor-blocking than bupivacaine, but toxicity is still possible."],
["Mepivacaine",16,"","Intermediate-acting amide.","Peripheral nerve blocks and infiltration when moderate duration is needed.","LAST risk; less vasodilation than lidocaine so epinephrine often optional."],
["Prilocaine",16,"","Amide with relatively low CNS toxicity; component of EMLA.","Infiltration, IV regional, topical.","Methemoglobinemia from o-toluidine metabolite—dose-related."],
["Chloroprocaine",16,"","Short-acting ester rapidly hydrolyzed by plasma cholinesterase.","Epidural for short cases / obstetric when rapid offset is wanted.","Avoid large volumes if atypical cholinesterase; past concerns with preservatives in spinal use—know your formulation."],
["Tetracaine",16,"","Long-acting potent ester.","Spinal anesthesia; topical ophthalmic / airway historically.","High systemic toxicity risk if absorbed rapidly; prolonged spinal block."],

["Ondansetron",17,"220","5-HT3 antagonist.","Prevention and treatment of postoperative nausea and vomiting.","QT prolongation, headache, constipation."],
["Dexamethasone",17,"220","Corticosteroid.","PONV prophylaxis, anti-inflammatory, airway edema adjunct.","Hyperglycemia; perineal pruritus with rapid injection."],
["Metoclopramide",17,"","Dopamine D2 antagonist; prokinetic.","PONV; accelerate gastric emptying when appropriate.","Extrapyramidal effects, akathisia; avoid in bowel obstruction / Parkinson disease."],
["Droperidol",17,"","Butyrophenone dopamine antagonist.","PONV; historically neurolept anesthesia.","QT prolongation (boxed warning historically); sedation, dysphoria."],
["Flumazenil",17,"228–229","Competitive benzodiazepine antagonist.","Reversal of benzodiazepine sedation.","Short action so sedation can return. Seizures in dependent patients or mixed overdoses."],
["Dantrolene",17,"","Ryanodine-receptor directed muscle relaxant reducing sarcoplasmic Ca2+ release.","Malignant hyperthermia treatment; also used in some spasm / NMS contexts.","Muscle weakness, hepatotoxicity with chronic oral use; prepare per institutional MH protocol."],
["Ketorolac",17,"","Parenteral NSAID (COX inhibition).","Opioid-sparing postoperative analgesia.","Bleeding risk, renal impairment, peptic ulcer disease—limit duration and dose."]
];



var cat="all";
var q=document.getElementById("q");
var list=document.getElementById("list");
var cnt=document.getElementById("count");
var nav=document.getElementById("nav");
var chips=document.getElementById("chips");
var side=document.getElementById("side");
var backdrop=document.getElementById("backdrop");
var toastEl=document.getElementById("toast");
var byName={};
D.forEach(function(d){ byName[d[0]]=d; });

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t=setTimeout(function(){ toastEl.classList.remove("show"); }, 1400);
}
function closeMenu(){
  side.classList.remove("open");
  backdrop.classList.remove("show");
  backdrop.hidden=true;
}
function flashBtn(btn){
  if(!btn) return;
  var old=btn.getAttribute("data-label") || btn.textContent;
  btn.setAttribute("data-label", old);
  btn.textContent="تم ✓";
  btn.classList.add("ok");
  setTimeout(function(){ btn.textContent=old; btn.classList.remove("ok"); }, 1100);
}
function writeText(text, btn){
  text=String(text||"");
  if(!text.trim()){ toast("لا يوجد نص"); return; }
  function ok(){ flashBtn(btn); toast("تم النسخ"); }
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=text;
    ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    var done=false;
    try{ done=document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    if(done) ok(); else toast("تعذر النسخ");
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(ok).catch(fallback);
  } else fallback();
}
function drugPlain(d){
  var lines=[d[0], "الفصل "+d[1]+" — "+C[d[1]].ar+" / "+C[d[1]].title, "", "الآلية: "+d[3], "", "الاستخدام: "+d[4], "", "التأثيرات والتحذيرات: "+d[5]];
  (d[6]||[]).forEach(function(e){ lines.push("", e[0]+": "+e[1]); });
  lines.push("", "د. منوّرة محمد جواد");
  return lines.join("\n");
}
function mkNav(){
  nav.innerHTML=""; chips.innerHTML="";
  function add(k, title, sub, chipLabel){
    var b=document.createElement("button");
    b.type="button";
    b.setAttribute("aria-pressed", String(k===cat));
    b.innerHTML='<span class="t">'+esc(title)+'</span><span class="s" dir="ltr" lang="en">'+esc(sub)+'</span>';
    b.onclick=function(){ cat=k; mkNav(); render(); closeMenu(); window.scrollTo({top:0,behavior:"smooth"}); };
    nav.appendChild(b);
    var c=document.createElement("button");
    c.type="button"; c.className="chip";
    c.setAttribute("aria-pressed", String(k===cat));
    c.textContent=chipLabel;
    c.onclick=function(){ cat=k; mkNav(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    chips.appendChild(c);
  }
  add("all","كل الفصول","Chapters 8–17","الكل");
  Object.keys(C).forEach(function(k){
    add(k, "الفصل "+k+" · "+C[k].ar, C[k].title, "ف "+k);
  });
}
function sectionHTML(titleAr, titleEn, text){
  var head=titleEn
    ? (esc(titleAr)+' <span class="meta-en" dir="ltr">· '+esc(titleEn)+'</span>')
    : '<span class="meta-en" dir="ltr">'+esc(titleAr)+'</span>';
  return '<div class="section">'+
    '<div class="section-head"><h3>'+head+'</h3>'+
    '<button type="button" class="copy-btn" data-kind="section">نسخ</button></div>'+
    '<p class="section-text" dir="ltr" lang="en">'+esc(text)+'</p></div>';
}
function card(d){
  var parts=[
    sectionHTML("الآلية","Mechanism", d[3]),
    sectionHTML("الاستخدام","Clinical use", d[4]),
    sectionHTML("التأثيرات والتحذيرات","Cautions", d[5])
  ];
  (d[6]||[]).forEach(function(e){ parts.push(sectionHTML(e[0], "", e[1])); });
  return '<details class="drug" data-drug="'+esc(d[0])+'">'+
    '<summary><span class="dot" aria-hidden="true"></span><span class="nm" dir="ltr" lang="en">'+esc(d[0])+'</span><span class="ch">ف '+d[1]+'</span></summary>'+
    '<div class="body">'+
      '<div class="actions"><button type="button" class="copy-btn" data-kind="all" data-drug="'+esc(d[0])+'">نسخ الموضوع كاملاً</button></div>'+
      parts.join("")+
    '</div></details>';
}
function render(){
  var s=q.value.trim().toLowerCase();
  var groups={}; Object.keys(C).forEach(function(k){ groups[k]=[]; });
  var total=0;
  D.forEach(function(d){
    if(cat!=="all" && String(d[1])!==String(cat)) return;
    var hay=(d.join(" ")+" "+C[d[1]].title+" "+C[d[1]].ar).toLowerCase();
    if(s && hay.indexOf(s)<0) return;
    groups[d[1]].push(d); total++;
  });
  document.getElementById("statDrugs").textContent=D.length+" دواء";
  cnt.textContent=total+" نتيجة"+(cat==="all"?"":" · الفصل "+cat);
  if(!total){
    list.innerHTML='<p class="empty">لا توجد نتائج مطابقة.</p>';
    return;
  }
  var html="";
  Object.keys(C).forEach(function(k){
    var arr=groups[k]; if(!arr.length) return;
    html+='<section class="chapter" id="ch-'+k+'">'+
      '<div class="chapter-head"><h2>الفصل '+k+': '+esc(C[k].ar)+'</h2>'+
      '<span class="meta meta-en" dir="ltr" lang="en">'+esc(C[k].title)+' · '+arr.length+'</span></div>'+
      '<div class="grid">'+arr.map(card).join("")+'</div></section>';
  });
  list.innerHTML=html;
}

list.addEventListener("click", function(e){
  var btn=e.target.closest(".copy-btn");
  if(!btn) return;
  e.preventDefault();
  e.stopPropagation();
  var kind=btn.getAttribute("data-kind");
  if(kind==="all"){
    var name=btn.getAttribute("data-drug");
    var d=byName[name];
    if(d) writeText(drugPlain(d), btn);
    return;
  }
  var box=btn.closest(".section");
  var p=box && box.querySelector(".section-text");
  writeText(p ? p.textContent : "", btn);
});

document.getElementById("copySel").onclick=function(){
  var sel=String(window.getSelection ? window.getSelection() : "");
  if(!sel.trim()){ toast("حدّد نصاً أولاً"); return; }
  writeText(sel, null);
};
q.addEventListener("input", render);
document.getElementById("expandAll").onclick=function(){ list.querySelectorAll("details").forEach(function(d){ d.open=true; }); };
document.getElementById("collapseAll").onclick=function(){ list.querySelectorAll("details").forEach(function(d){ d.open=false; }); };
document.getElementById("themeBtn").onclick=function(){
  var dark=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme", dark?"light":"dark");
};
document.getElementById("menuBtn").onclick=function(){
  side.classList.add("open"); backdrop.hidden=false; backdrop.classList.add("show");
};
backdrop.addEventListener("click", closeMenu);
mkNav(); render();
</script>
</body>
</html>
