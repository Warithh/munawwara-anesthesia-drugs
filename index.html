<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08353C">
<title>د. منوّرة محمد جواد — مرجع أدوية التخدير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3FAFB; --ink:#102830;
  --muted:#5A737B; --line:rgba(16,40,48,.12); --accent:#0E7F88;
  --accent-2:#C4A574; --surface:#FFFFFF; --soft:#E5F3F4;
  --side:#0A2B32; --side-ink:#D7EBEE; --side-muted:#8BB0B7;
  --panel:rgba(255,255,255,.72); --section:#F7FCFC; --section-2:#F1F8F9;
  --chapter-bg:linear-gradient(180deg, rgba(243,250,251,.96), rgba(243,250,251,.88));
  --page-bg:radial-gradient(900px 420px at 90% -10%, rgba(196,165,116,.18), transparent 55%),
    radial-gradient(700px 500px at -10% 20%, rgba(14,127,136,.14), transparent 50%),
    linear-gradient(180deg, #EAF5F6 0%, var(--paper) 28%, #EEF6F7 100%);
  --ok:#0B7A5A; --accent-ink:#FFFFFF;
  /* قيم افتراضية للجوال — تُكبَّر تدريجياً بالـ media queries */
  --top:56px; --r:14px; --pad-x:12px; --pad-y:12px; --gap:10px; --fs:15px;
  --hero-h1:clamp(1.28rem, 1rem + 3.2vw, 1.6rem);
  --brand-fs:clamp(.9rem, 0.78rem + 2vw, 1.1rem);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
html[data-theme="dark"]{
  --paper:#0B1C21; --ink:#E7F3F5;
  --muted:#9BB4BB; --line:rgba(231,243,245,.12); --accent:#4DBDC8;
  --accent-2:#D2B484; --surface:#12262C; --soft:#16343A;
  --side:#07171C; --side-ink:#D7EBEE; --side-muted:#7FA4AC;
  --panel:rgba(18,38,44,.82); --section:#153038; --section-2:#12282E;
  --chapter-bg:linear-gradient(180deg, rgba(11,28,33,.96), rgba(11,28,33,.88));
  --page-bg:radial-gradient(800px 380px at 90% -10%, rgba(196,165,116,.12), transparent 55%),
    linear-gradient(180deg, #07161B 0%, #0B1C21 100%);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
img,svg,video{max-width:100%; height:auto}
html{
  scroll-behavior:smooth; scroll-padding-top:calc(var(--top) + 12px);
  overflow-x:hidden; width:100%; max-width:100vw;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
body{
  margin:0; color:var(--ink); font-family:"Tajawal",sans-serif; font-size:var(--fs); line-height:1.6;
  background:var(--page-bg);
  min-height:100vh; width:100%; max-width:100vw; overflow-x:hidden;
  -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.35; z-index:0;
  background-image:linear-gradient(rgba(14,127,136,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(14,127,136,.05) 1px, transparent 1px);
  background-size:28px 28px; mask-image:radial-gradient(ellipse at center, #000 30%, transparent 78%);
}
::selection{background:rgba(14,127,136,.28)}
button,input{font:inherit; touch-action:manipulation}
.wrap{position:relative; z-index:1; max-width:1320px; margin:0 auto; width:100%; overflow-x:hidden}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:8px;
  min-height:var(--top);
  padding-top:calc(8px + var(--safe-t));
  padding-bottom:8px;
  padding-inline:max(12px, var(--safe-l)) max(12px, var(--safe-r));
  background:rgba(7,30,36,.92); color:#EAF6F7;
  backdrop-filter:blur(16px) saturate(1.2);
  border-bottom:1px solid rgba(255,255,255,.08);
  width:100%;
}
.topbar .mark{
  width:clamp(34px, 9vw, 42px); height:clamp(34px, 9vw, 42px); border-radius:12px; flex:none;
  display:grid; place-items:center; font-family:"Amiri",serif; font-weight:700; font-size:clamp(1rem, 2.8vw, 1.2rem);
  background:linear-gradient(145deg, var(--accent-2), #9A7A4A); color:#1A1208;
  box-shadow:0 8px 20px rgba(196,165,116,.25);
}
.brand{flex:1; min-width:0}
.brand strong{display:block; font-family:"Amiri",serif; font-size:var(--brand-fs); font-weight:700; line-height:1.2}
.brand span{display:block; font-size:clamp(.68rem, 2.2vw, .78rem); opacity:.72; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.icon{
  width:clamp(38px, 10vw, 44px); height:clamp(38px, 10vw, 44px); border-radius:12px; border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06); color:#EAF6F7; cursor:pointer; display:grid; place-items:center; flex:none;
}
.icon:active{transform:scale(.96)}

.shell{display:grid; grid-template-columns:1fr; gap:0; min-height:calc(100vh - var(--top)); width:100%}
.menu-only{display:grid}
.chips{display:flex}
.side{
  background:linear-gradient(180deg, var(--side) 0%, #071F25 100%);
  color:var(--side-ink);
  padding:calc(16px + var(--safe-t)) 12px calc(24px + var(--safe-b));
  position:fixed; top:0; bottom:0; inset-inline-start:0;
  width:min(86vw, 300px); height:100%; max-height:100dvh;
  overflow:auto; z-index:55;
  border-inline-end:1px solid rgba(255,255,255,.06);
  /* إخفاء الدرج خارج الشاشة — صحيح لـ RTL و LTR */
  transform:translate3d(105%,0,0);
  transition:transform .24s ease;
  will-change:transform;
}
html[dir="ltr"] .side{transform:translate3d(-105%,0,0)}
html[dir="rtl"] .side{transform:translate3d(105%,0,0)}
.side.open{transform:translate3d(0,0,0)!important}
.side-title{font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--side-muted); margin:0 10px 12px; font-weight:700}
.nav{display:flex; flex-direction:column; gap:6px}
.nav button{
  text-align:start; border:0; cursor:pointer; color:inherit; background:transparent;
  border-radius:14px; padding:12px 14px; transition:background .2s, transform .2s;
}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-pressed="true"]{
  background:linear-gradient(90deg, rgba(196,165,116,.22), rgba(14,127,136,.35));
  box-shadow:inset 3px 0 0 var(--accent-2);
}
.nav .t{display:block; font-weight:700; font-size:.95rem}
.nav .s{display:block; font-size:.75rem; color:var(--side-muted); margin-top:3px}

.main{padding:var(--pad-y) var(--pad-x) calc(48px + var(--safe-b)); min-width:0; width:100%; max-width:100%; overflow-x:hidden}
.hero{
  position:relative; overflow:hidden; border-radius:clamp(14px, 3vw, 24px); margin-bottom:12px;
  padding:clamp(12px, 3vw, 28px);
  color:#F4FBFC;
  background:
    radial-gradient(500px 220px at 85% 0%, rgba(196,165,116,.35), transparent 60%),
    linear-gradient(135deg, #08353C 0%, #0E5B63 48%, #0A444C 100%);
  box-shadow:0 16px 36px rgba(8,53,60,.18);
  animation:rise .7s ease both;
}
.hero::after{
  content:""; position:absolute; inset:auto -10% -40% auto; width:min(280px, 55vw); height:min(280px, 55vw); border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.12), transparent 70%); pointer-events:none;
}
.hero-kicker{margin:0 0 8px; color:var(--accent-2); font-weight:700; font-size:clamp(.72rem, 2.2vw, .85rem); letter-spacing:.04em}
.hero h1{
  margin:0; font-family:"Amiri",serif; font-weight:700;
  font-size:var(--hero-h1); line-height:1.3; max-width:100%;
  overflow-wrap:anywhere; word-break:break-word;
}
.hero p{margin:10px 0 0; max-width:42ch; opacity:.86; font-size:clamp(.9rem, 2.5vw, 1.02rem)}
.hero-stats{display:flex; flex-wrap:wrap; gap:8px; margin-top:clamp(12px, 3vw, 18px)}
.hero-stats span{
  display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.12); font-size:clamp(.72rem, 2.2vw, .84rem);
}

.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:clamp(14px, 3vw, 22px);
  padding:clamp(10px, 2.5vw, 14px); backdrop-filter:blur(8px); margin-bottom:14px;
  box-shadow:0 10px 30px rgba(16,40,48,.04); animation:rise .75s .05s ease both;
}
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; -webkit-overflow-scrolling:touch; scrollbar-width:thin}
.chip{
  flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:9px 14px; cursor:pointer; font-size:.86rem; font-weight:700;
}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.toolbar{display:grid; gap:10px}
.search{
  display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; padding-block:4px; padding-inline:14px 4px; width:100%;
}
.search svg{flex:none; opacity:.55}
.search input{
  flex:1; border:0; outline:0; background:transparent; padding:12px 8px;
  font-size:16px; min-width:0; /* 16px يمنع زوم iOS */
  color:var(--ink); -webkit-user-select:text; user-select:text;
}
.tools{display:flex; flex-wrap:wrap; gap:8px}
.tools button{
  min-height:40px; padding:8px 12px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); cursor:pointer; font-weight:700; font-size:clamp(.8rem, 2.3vw, .88rem); color:var(--ink);
}
.tools button:hover{border-color:var(--accent); color:var(--accent)}
.count{margin:10px 4px 14px; color:var(--muted); font-size:.9rem; font-weight:500}

.chapter{margin:0 0 28px; animation:rise .5s ease both}
.chapter-head{
  display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:8px;
  margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line);
  position:sticky; top:calc(var(--top) + 4px); z-index:5;
  background:var(--chapter-bg);
  backdrop-filter:blur(8px);
}
.chapter-head h2{margin:0; font-size:clamp(1rem, 2.8vw, 1.15rem); font-weight:800; min-width:0; overflow-wrap:anywhere}
.chapter-head .meta{color:var(--muted); font-size:clamp(.72rem, 2.1vw, .82rem)}
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:var(--gap);
  width:100%;
}

details.drug{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; min-width:0; width:100%;
  transition:box-shadow .25s, border-color .25s;
}
details.drug[open]{border-color:rgba(14,127,136,.35); box-shadow:0 16px 36px rgba(8,53,60,.08)}
summary{
  list-style:none; cursor:pointer; padding:clamp(12px, 2.8vw, 16px);
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:clamp(8px, 2vw, 12px); align-items:center;
  -webkit-user-select:text; user-select:text;
}
summary::-webkit-details-marker{display:none}
.dot{
  width:8px; height:8px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 0 5px rgba(14,127,136,.12); flex:none;
}
.nm{
  font-family:"Literata",Georgia,serif; font-weight:700; font-size:clamp(.98rem, 2.6vw, 1.12rem); line-height:1.3;
  direction:ltr; unicode-bidi:isolate; text-align:left; min-width:0; overflow-wrap:anywhere;
}
.ch{font-size:clamp(.68rem, 2vw, .75rem); font-weight:700; color:var(--accent); background:var(--soft); padding:3px 8px; border-radius:999px; white-space:nowrap}
.body{padding:0 clamp(10px, 2.5vw, 14px) clamp(12px, 3vw, 16px); border-top:1px solid var(--line)}
.actions{display:flex; justify-content:flex-end; padding:12px 0 4px}
.tabs{
  display:flex; gap:6px; padding:10px 0 4px; border-bottom:1px solid var(--line); margin-bottom:4px;
}
.tab-btn{
  flex:1; min-height:40px; border-radius:10px; cursor:pointer; font-weight:800; font-size:clamp(.78rem, 2.2vw, .88rem);
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
}
.tab-btn[aria-selected="true"]{
  background:var(--accent); color:var(--accent-ink, #fff); border-color:var(--accent);
}
.tab-btn.tab-dosage[aria-selected="true"]{
  background:linear-gradient(135deg, #8A6A35, #C4A574); border-color:#C4A574; color:#1A1208;
}
.tab-panel{display:none; padding-bottom:4px}
.tab-panel.active{display:block}
.section{
  margin-top:10px; padding:clamp(10px, 2.4vw, 12px); border-radius:12px;
  background:linear-gradient(180deg, var(--section), var(--section-2));
  border:1px solid rgba(14,127,136,.1);
  min-width:0;
}
.section-dosage{
  border-color:rgba(196,165,116,.45);
  background:linear-gradient(180deg, rgba(196,165,116,.12), var(--section-2));
  margin-top:10px;
}
.section-dosage h3{color:#8A6A35}
html[data-theme="dark"] .section-dosage h3{color:var(--accent-2)}
.section-head{display:flex; align-items:center; gap:8px; margin-bottom:6px; direction:rtl; min-width:0}
.section-head h3{margin:0; flex:1; min-width:0; font-size:clamp(.8rem, 2.3vw, .9rem); font-weight:800; color:var(--accent); overflow-wrap:anywhere}
.copy-btn{
  flex:none; min-height:34px; padding:5px 10px; border-radius:10px; cursor:pointer;
  border:1px solid rgba(14,127,136,.2); background:var(--surface); color:var(--accent);
  font-size:clamp(.72rem, 2vw, .8rem); font-weight:800;
}
.copy-btn.ok{background:#E8F7F0; border-color:var(--ok); color:var(--ok)}
.section-text{
  margin:0; font-size:clamp(.88rem, 2.4vw, .98rem); white-space:pre-wrap; overflow-wrap:anywhere;
  direction:ltr; unicode-bidi:isolate; text-align:left;
  -webkit-user-select:text; user-select:text;
}
.meta-en,.hero-kicker{direction:ltr; unicode-bidi:isolate; text-align:left}
.ref{margin:12px 2px 0; color:var(--muted); font-size:.8rem; direction:rtl}
.empty{text-align:center; padding:40px 10px; color:var(--muted)}
.foot{margin-top:28px; color:var(--muted); font-size:.9rem; text-align:center}
.foot strong{color:var(--ink); font-family:"Amiri",serif; font-size:1.05rem}

.backdrop{display:none; position:fixed; inset:0; background:rgba(4,18,22,.5); z-index:50}
.backdrop.show{display:block}
.toast{
  position:fixed; left:50%; bottom:calc(20px + var(--safe-b)); transform:translateX(-50%) translateY(140%);
  background:#08353C; color:#F3FAFB; padding:12px 18px; border-radius:999px; font-weight:700;
  z-index:60; opacity:0; transition:.28s ease; pointer-events:none; box-shadow:0 12px 30px rgba(0,0,0,.25);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@keyframes rise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  .hero,.panel,.chapter{animation:none!important}
}

/* —— هاتف —— */
.topbar .mark{display:none}
.tools button{flex:1 1 calc(50% - 8px); min-width:0}
.chapter-head{top:calc(var(--top) + 2px); padding-inline:2px}
.toast{max-width:min(420px, calc(100vw - 24px)); white-space:normal; text-align:center; font-size:.85rem}
.hero p{max-width:100%}
.section-head{flex-wrap:wrap}
.nav .s{overflow-wrap:anywhere}
.chips{margin-inline:-2px; padding-inline:2px; overscroll-behavior-x:contain}
.panel{overflow:hidden}

@media (min-width:480px){
  :root{
    --fs:15.5px; --top:58px; --pad-x:14px; --pad-y:14px; --r:15px;
    --hero-h1:clamp(1.38rem, 1.05rem + 2.4vw, 1.8rem);
    --brand-fs:clamp(.98rem, 0.88rem + 1.2vw, 1.18rem);
  }
  .topbar .mark{display:grid}
}

/* آيباد عمودي / تابلت: قائمة منسدلة + عمود أدوية واحد أو اثنين */
@media (min-width:768px){
  :root{
    --fs:15.5px; --top:60px; --r:16px; --pad-x:16px; --pad-y:16px; --gap:12px;
    --hero-h1:clamp(1.5rem, 1.15rem + 1.4vw, 2rem);
    --brand-fs:clamp(1.02rem, 0.92rem + 0.7vw, 1.22rem);
  }
  .side{width:min(70vw, 300px)}
  .tools button{flex:0 1 auto}
  .grid{grid-template-columns:1fr}
}

@media (min-width:900px) and (max-width:1099px){
  .grid{grid-template-columns:repeat(2, minmax(0, 1fr))}
}

/* سطح مكتب: شريط فصول ثابت */
@media (min-width:1100px){
  :root{
    --fs:16.5px; --top:68px; --r:18px; --pad-x:24px; --pad-y:22px; --gap:14px;
    --hero-h1:clamp(1.85rem, 1.2rem + 2.2vw, 3.05rem);
    --brand-fs:clamp(1.05rem, 0.95rem + 0.6vw, 1.4rem);
  }
  .menu-only{display:none!important}
  .chips{display:none!important}
  .shell{
    display:grid;
    grid-template-columns:270px minmax(0, 1fr);
    min-height:calc(100vh - var(--top));
  }
  .side{
    position:sticky; top:var(--top);
    inset:auto; inset-inline-start:auto;
    width:auto; height:calc(100vh - var(--top)); max-height:none;
    transform:none!important;
    padding:22px 14px calc(28px + var(--safe-b));
    z-index:1; will-change:auto;
  }
  html[dir="rtl"] .side,
  html[dir="ltr"] .side{transform:none!important}
  .grid{grid-template-columns:repeat(auto-fill, minmax(min(100%, 320px), 1fr))}
  .topbar .mark{display:grid}
  .backdrop.show{display:none!important}
  .tools button{flex:0 1 auto}
}
</style>
</head>
<body>
<div class="backdrop" id="backdrop" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<header class="topbar">
  <button type="button" class="icon menu-only" id="menuBtn" aria-label="الفصول">☰</button>
  <div class="mark" aria-hidden="true">م</div>
  <div class="brand">
    <strong>الدكتورة منوّرة محمد جواد</strong>
    <span>مرجع أدوية التخدير والعناية الحرجة</span>
  </div>
  <button type="button" class="icon" id="themeBtn" aria-label="مظهر" title="مظهر">◐</button>
</header>

<div class="wrap">
<div class="shell">
  <aside class="side" id="side" aria-label="الفصول">
    <p class="side-title">الفصول</p>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <section class="hero">
      <p class="hero-kicker" dir="ltr" lang="en">Anesthesia Drug Desk</p>
      <h1>الدكتورة منوّرة محمد جواد</h1>
      <p>مرجع منظم لأدوية التخدير.</p>
      <div class="hero-stats">
        <span id="statDrugs">— دواء</span>
        <span>10 فصول</span>
        <span>Dosage × 67</span>
      </div>
    </section>

    <div class="panel">
      <div class="chips" id="chips"></div>
      <div class="toolbar">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="q" placeholder="ابحث عن دواء، آلية، أو تأثير…" aria-label="بحث" autocomplete="off">
        </label>
        <div class="tools">
          <button type="button" id="expandAll">توسيع الكل</button>
          <button type="button" id="collapseAll">طي الكل</button>
          <button type="button" id="copySel">نسخ التحديد</button>
        </div>
      </div>
    </div>

    <p class="count" id="count" aria-live="polite"></p>
    <div id="list"></div>
    <p class="foot"><strong>د. منوّرة محمد جواد</strong><br>مرجع أدوية التخدير</p>
  </main>
</div>
</div>

<script>
document.addEventListener("copy", function(){}, true);
document.addEventListener("cut", function(){}, true);

var C={
  8:{title:"Inhalation Anesthetics", ar:"مخدرات استنشاقية", pdf:"1–35"},
  9:{title:"Intravenous Anesthetics", ar:"مخدرات وريدية", pdf:"36–60"},
